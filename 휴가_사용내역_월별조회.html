<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileImage" content="mstile-150x150.png">
<meta name="msapplication-TileColor" content="#0a080e">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>휴가 사용내역 (월별)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    table { font-size: 13.5px; }
    thead th, tbody td { padding: 8px 10px; }
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 24px; text-align: center; }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08); margin-bottom: 18px;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 140px; }
  .field label { display: block; font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  input[type=month], input[type=text] {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    padding: 12px 20px; border-radius: 999px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button:hover { opacity: 0.92; }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 12px 0; min-height: 18px; white-space: pre-line; }
  .empty { color: var(--muted2); font-size: 15px; text-align: center; margin-top: 24px; }

  .summary-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .summary { flex: 1; background: var(--accent-soft); border-radius: 10px; padding: 13px; text-align: center; }
  .summary .label { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .summary .value { font-size: 22px; font-weight: 800; color: var(--ink); }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:nth-child(even) { background: #faf3fb; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .tag-month { background: var(--accent-soft); color: var(--accent); }
  .tag-annual { background: #fbe4ec; color: var(--warn); }
  .tag-etc { background: #f0eaf7; color: var(--muted); }
  .note { color: var(--muted2); font-size: 13px; }
  .table-scroll { overflow-x: auto; }
  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 20px; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1000px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .panel { padding: 24px; }
    .field label { font-size: 14px; }
    input[type=month], input[type=text] { font-size: 17px; padding: 13px 15px; }
    button { font-size: 16px; padding: 13px 24px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .status { font-size: 15px; }
    .summary { padding: 16px; }
    .summary .label { font-size: 14px; }
    .summary .value { font-size: 25px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }
    .tag { font-size: 13.5px; padding: 4px 12px; }
    .empty { font-size: 16px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>휴가 사용내역 (월별)</h1>
  <p class="sub">조회 월을 선택하면 해당 월에 사용된 휴가 내역이 바로 조회됩니다.</p>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label>조회 월</label>
        <input type="month" id="monthInput">
      </div>
      <div class="field">
        <label>재직 구분</label>
        <select id="statusFilter" onchange="document.getElementById('monthInput').disabled = (this.value === 'resigned'); doSearch()" style="font-size:15px; padding:11px; border:1px solid var(--line); border-radius:10px; background:#fff;">
          <option value="all">전체</option><option value="active">재직자</option><option value="resigned">퇴사자</option>
        </select>
      </div>
      <div class="field" style="flex:2;">
        <label>이름 또는 전화번호</label>
        <input type="text" id="personSearch" placeholder="이름 / 전화번호 (선택)" autocomplete="off" style="width:100%; font-size:15px; padding:11px; border:1px solid var(--line); border-radius:10px; background:#fff;">
      </div>
      <button type="button" onclick="doSearch()">조회하기</button>
    </div>
    <div class="branch-row" id="branchRow">
      <button type="button" class="branch-btn active" data-office="" onclick="selectOffice('')">전체</button>
    </div>
    <div class="role-row" id="roleRow">
      <button type="button" class="role-btn active" data-role="" onclick="selectRole('')">전체</button>
    </div>
    <div class="toolbar-row">
      <button type="button" class="excel-btn" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>
  <div class="updated" id="updated"></div>
</div>

<script>
  var SHEET_ID = '1X3LpMT3fl7AoIPPPNwces5UK4-uWxEkuDBkRX6BWvAE';
  var GID_HISTORY = '628017033'; // 휴가사용내역 탭 (전체 이력)

  var COL_HIST = {
    branch: 1, role: 2, name: 3, memberId: 4,
    startDate: 5, endDate: 6, days: 7, type: 8, note: 9
  };
  var HIST_DATA_START_ROW = 1;
  var GID_INFO = '578655642'; // 사원정보 탭 (재직/퇴사 여부, 연락처 확인용)
  var HEADER_LABELS = { memberId: '회원번호', branch: '지점', role: '업무구분', name: '직원명',
    hireDate: '입사일', resignDate: '퇴사일', employmentStatus: '재직상태', phone: '연락처' };
  var resignedIds = {};   // 회원번호 -> true (재직 기록이 하나도 없는 퇴사자)
  var phoneById = {};     // 회원번호 -> 연락처(숫자만)

  function findHeaderRow_(rows) {
    var keys = Object.keys(HEADER_LABELS);
    var needed = Math.ceil(keys.length / 2);
    for (var r = 0; r < rows.length; r++) {
      var map = {}, found = 0;
      keys.forEach(function(k) { var i = rows[r].indexOf(HEADER_LABELS[k]); if (i !== -1) { map[k] = i; found++; } });
      if (found >= needed) return { colMap: map, dataStartRow: r + 1 };
    }
    return null;
  }

  var histRows = null;
  var selectedOffice = '';
  var selectedRole = '';
  var currentMonth = null;
  var lastMatches = [];

  // Default to current month
  (function initMonth() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    document.getElementById('monthInput').value = y + '-' + m;
  })();

  document.getElementById('monthInput').addEventListener('change', function(){
    doSearch();
  });

  function setStatus(msg) {
    document.getElementById('status').textContent = msg || '';
  }

  // 지점명에 괄호가 있으면("광주(전주)") 괄호 앞부분을 대표 지점명으로 사용합니다.
  // 지점 버튼은 이 대표 이름 기준으로 중복 없이 하나만 만들고, 그 버튼을 누르면
  // 괄호 안 표기를 포함한 모든 관련 행이 함께 보입니다. (표/엑셀에는 원본 텍스트 그대로 표시)
  function branchLabel(raw) {
    var s = (raw || '').trim();
    var idx = s.indexOf('(');
    return idx === -1 ? s : s.slice(0, idx).trim();
  }

  // 시트에 누군가 일반 "필터"를 걸어도 항상 전체 데이터를 보도록, 구글 gviz 대신
  // Apps Script 백엔드(action=getSheetData)를 거쳐 읽습니다. (Code.gs의 ALLOWED_READ_SHEETS에 등록된 탭만 허용)
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';
  function fetchSheet(gid, onDone, onError, headersCount) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      clearTimeout(timer);
      if (!data || !data.ok) throw new Error((data && data.error) || '시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err) {
      clearTimeout(timer);
      onError(err && err.name === 'AbortError' ? new Error('응답 시간이 초과되었습니다.') : (err instanceof Error ? err : new Error(String(err))));
    });
  }

  function loadHistory(callback, onError) {
    setStatus('시트에서 데이터를 불러오는 중입니다...');
    fetchSheet(GID_HISTORY, function(rows) {
      histRows = rows.slice(HIST_DATA_START_ROW).filter(function(row) {
        return row[COL_HIST.name] && row[COL_HIST.name].trim().length > 0 && row[COL_HIST.startDate] && row[COL_HIST.startDate].trim().length > 0;
      });
      fetchSheet(GID_INFO, function(infoRows) {
        var header = findHeaderRow_(infoRows);
        if (header && header.colMap.memberId !== undefined) {
          var C = header.colMap, hasActive = {}, hasResigned = {};
          infoRows.slice(header.dataStartRow).forEach(function(r) {
            var id = (r[C.memberId] || '').trim();
            if (!id) return;
            // 대시보드와 같은 기준: 퇴사일이 오늘 이전/당일이면 퇴사, 오늘 이후(퇴사예정)는 재직중
            var rm = String(C.resignDate !== undefined ? (r[C.resignDate] || '') : '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
            var gone;
            if (rm) { var t0 = new Date(); t0.setHours(0,0,0,0); gone = new Date(+rm[1], +rm[2]-1, +rm[3]) <= t0; }
            else { var st = C.employmentStatus !== undefined ? (r[C.employmentStatus] || '') : ''; gone = st.indexOf('퇴사') !== -1 && st.indexOf('예정') === -1; }
            if (gone) hasResigned[id] = true; else hasActive[id] = true;
            if (C.phone !== undefined) {
              var ph = String(r[C.phone] || '').replace(/[^0-9]/g, '');
              if (ph && (!phoneById[id] || !gone)) phoneById[id] = ph;
            }
          });
          resignedIds = {};
          Object.keys(hasResigned).forEach(function(id) { if (!hasActive[id]) resignedIds[id] = true; });
        }
        document.getElementById('updated').textContent = '마지막 조회: ' + new Date().toLocaleString('ko-KR');
        populateOfficeFilter();
        populateRoleFilter();
        callback();
      }, onError, 2);
    }, onError);
  }

  function populateOfficeFilter() {
    var offices = {};
    histRows.forEach(function(r) {
      var o = branchLabel(r[COL_HIST.branch]);
      if (o) offices[o] = true;
    });
    var row = document.getElementById('branchRow');
    row.innerHTML = '<button type="button" class="branch-btn active" data-office="" onclick="selectOffice(\'\')">전체</button>';
    Object.keys(offices).sort(function(a, b) { return a.localeCompare(b, 'ko'); }).forEach(function(o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'branch-btn';
      btn.setAttribute('data-office', o);
      btn.textContent = o;
      btn.onclick = function() { selectOffice(o); };
      row.appendChild(btn);
    });
  }

  function selectOffice(office) {
    selectedOffice = office;
    document.querySelectorAll('.branch-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-office') === office);
    });
    selectedRole = '';
    populateRoleFilter();
    if (currentMonth) render(currentMonth);
  }

  function populateRoleFilter() {
    var row = document.getElementById('roleRow');
    row.innerHTML = '<button type="button" class="role-btn active" data-role="" onclick="selectRole(\'\')">전체</button>';
    var roles = {};
    histRows.forEach(function(r) {
      if (selectedOffice && branchLabel(r[COL_HIST.branch]) !== selectedOffice) return;
      var role = (r[COL_HIST.role] || '').trim();
      if (role) roles[role] = true;
    });
    Object.keys(roles).sort().forEach(function(role) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-btn';
      btn.setAttribute('data-role', role);
      btn.textContent = role;
      btn.onclick = function() { selectRole(role); };
      row.appendChild(btn);
    });
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-role') === role);
    });
    if (currentMonth) render(currentMonth);
  }

  function toYearMonth(dateStr) {
    if (!dateStr) return null;
    // Handles "2026-08-20", "2026. 8. 20", "2026/8/20", etc.
    var m = String(dateStr).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) {
      return m[1] + '-' + String(m[2]).padStart(2, '0');
    }
    var t = Date.parse(dateStr);
    if (!isNaN(t)) {
      var d = new Date(t);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    return null;
  }

  function parseDateForSort(dateStr) {
    if (!dateStr) return 0;
    var m = String(dateStr).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) {
      return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10)).getTime();
    }
    var t = Date.parse(dateStr);
    return isNaN(t) ? 0 : t;
  }

  function tagClass(type) {
    var t = (type || '').trim();
    if (t.indexOf('월차') !== -1) return 'tag-month';
    if (t.indexOf('연차') !== -1) return 'tag-annual';
    return 'tag-etc';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function doSearch() {
    var month = document.getElementById('monthInput').value;

    if (!month) { setStatus('조회할 월을 선택해주세요.'); return; }
    currentMonth = month;

    if (histRows) {
      setStatus('');
      render(month);
    } else {
      loadHistory(
        function(){ setStatus(''); render(month); },
        function(err){ setStatus('오류: ' + err.message); }
      );
    }
  }

  function render(month) {
    var container = document.getElementById('results');

    var matches = histRows.filter(function(row) {
      var ym = toYearMonth(row[COL_HIST.startDate]);
      var allMonths = document.getElementById('statusFilter').value === 'resigned'; // 퇴사자는 월과 무관하게 전체 기간
      if (!allMonths && ym !== month) return false;
      if (selectedOffice && branchLabel(row[COL_HIST.branch]) !== selectedOffice) return false;
      if (selectedRole && (row[COL_HIST.role] || '').trim() !== selectedRole) return false;
      var id = (row[COL_HIST.memberId] || '').trim();
      var f = document.getElementById('statusFilter').value;
      if (f !== 'all') { var isRes = !!resignedIds[id]; if (f === 'resigned' ? !isRes : isRes) return false; }
      var q = document.getElementById('personSearch').value.trim();
      if (q) {
        var digits = q.replace(/[^0-9]/g, '');
        if (digits.length >= 4 && digits.length === q.replace(/[\s\-]/g, '').length) {
          if ((phoneById[id] || '').indexOf(digits) === -1) return false;
        } else if ((row[COL_HIST.name] || '').replace(/\s+/g, '').indexOf(q.replace(/\s+/g, '')) === -1) return false;
      }
      return true;
    });

    lastMatches = matches;

    if (matches.length === 0) {
      container.innerHTML = '<div class="empty">' + (document.getElementById('statusFilter').value === 'resigned' ? '조회되는 퇴사자의 휴가 사용 기록이 없습니다.' : '해당 월에 조회되는 휴가 사용 기록이 없습니다.') + '</div>';
      return;
    }

    var allPeriod = document.getElementById('statusFilter').value === 'resigned';
    matches.sort(function(a, b) {
      if (allPeriod) {
        var c = (a[COL_HIST.name] || '').localeCompare(b[COL_HIST.name] || '', 'ko');
        if (c !== 0) return c;
      }
      return parseDateForSort(a[COL_HIST.startDate]) - parseDateForSort(b[COL_HIST.startDate]);
    });

    var totalMonthly = 0, totalAnnual = 0;
    matches.forEach(function(row) {
      var d = parseFloat(row[COL_HIST.days]) || 0;
      var t = (row[COL_HIST.type] || '').trim();
      if (t.indexOf('월차') !== -1) totalMonthly += d;
      else if (t.indexOf('연차') !== -1) totalAnnual += d;
    });

    var html = allPeriod ? '<div class="meta" style="margin:10px 0; font-weight:700;">퇴사자 조회: 조회 월과 상관없이 전체 기간의 휴가 사용 내역을 보여줍니다.</div>' : '';
    html += '<div class="summary-row">';
    html += '<div class="summary"><div class="label">월차 합계</div><div class="value">' + totalMonthly + '</div></div>';
    html += '<div class="summary"><div class="label">연차 합계</div><div class="value">' + totalAnnual + '</div></div>';
    html += '<div class="summary"><div class="label">총 건수</div><div class="value">' + matches.length + '</div></div>';
    html += '</div>';

    html += '<div class="table-scroll"><table><thead><tr>';
    html += '<th>이름</th><th>구분</th><th>지점</th><th>시작일</th><th>종료일</th><th>일수</th><th>종류</th><th>비고</th>';
    html += '</tr></thead><tbody>';
    matches.forEach(function(row) {
      html += '<tr>';
      html += '<td>' + escapeHtml(row[COL_HIST.name] || '') + '</td>';
      html += '<td>' + (resignedIds[(row[COL_HIST.memberId] || '').trim()] ? '<span class="tag tag-etc">퇴사</span>' : '재직') + '</td>';
      html += '<td>' + escapeHtml(row[COL_HIST.branch] || '') + '</td>';
      html += '<td>' + escapeHtml(row[COL_HIST.startDate] || '') + '</td>';
      html += '<td>' + escapeHtml(row[COL_HIST.endDate] || '') + '</td>';
      html += '<td>' + escapeHtml(row[COL_HIST.days] || '') + '</td>';
      html += '<td><span class="tag ' + tagClass(row[COL_HIST.type]) + '">' + escapeHtml(row[COL_HIST.type] || '') + '</span></td>';
      html += '<td class="note">' + escapeHtml(row[COL_HIST.note] || '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    container.innerHTML = html;
  }

  function downloadExcel() {
    if (lastMatches.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['이름', '지점', '업무구분', '재직구분', '시작일', '종료일', '일수', '종류', '비고']];
    lastMatches.forEach(function(row) {
      aoa.push([
        row[COL_HIST.name] || '', row[COL_HIST.branch] || '', row[COL_HIST.role] || '', (resignedIds[(row[COL_HIST.memberId] || '').trim()] ? '퇴사' : '재직'),
        row[COL_HIST.startDate] || '', row[COL_HIST.endDate] || '',
        row[COL_HIST.days] || '', row[COL_HIST.type] || '', row[COL_HIST.note] || ''
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '휴가사용내역');
    var stamp = (document.getElementById('statusFilter').value === 'resigned') ? '퇴사자_전체' : (currentMonth || new Date().toISOString().slice(0, 7));
    XLSX.writeFile(wb, '휴가_사용내역_' + stamp + '.xlsx');
  }

  document.getElementById('personSearch').addEventListener('input', function(){ if (histRows) render(document.getElementById('monthInput').value); });

  // Auto-run for the current month on load
  doSearch();
</script>
</body>
</html>
