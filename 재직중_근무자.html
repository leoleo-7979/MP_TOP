<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileImage" content="mstile-150x150.png">
<meta name="msapplication-TileColor" content="#0a080e">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>재직중 근무자</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    table { font-size: 13.5px; }
    thead th, tbody td { padding: 8px 10px; }
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 20px; text-align: center; }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08);
  }
  .controls { display: flex; gap: 8px; margin-bottom: 4px; }
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 10px 0; min-height: 18px; white-space: pre-line; }
  .count { font-size: 13.5px; color: var(--muted); margin: 10px 2px 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .count .total { font-weight: 700; color: var(--ink); }
  .count .role-chip {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    background: var(--accent-soft); border-radius: 12px;
    padding: 3px 10px;
  }
  .count .role-chip b { color: var(--accent); }

  .office-group { margin-top: 22px; }
  .office-group:first-of-type { margin-top: 6px; }
  .office-header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 6px 10px;
    padding: 11px 13px; background: var(--accent-soft); border-radius: 10px 10px 0 0;
  }
  .office-name { font-size: 16px; font-weight: 800; color: var(--accent); }
  .office-total { font-size: 13.5px; font-weight: 700; color: var(--accent); }
  .role-breakdown { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
  .role-chip {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 3px 10px;
  }
  .role-chip b { color: var(--accent); }

  .contract-badge {
    display: inline-block; padding: 3px 10px; border-radius: 14px;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: #dcf3e4; color: #2f8f66;
  }
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 14px;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: #fbe4ec; color: var(--warn);
  }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-top: none; border-radius: 0 0 10px 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14.5px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  tbody td.wrap-cell { white-space: normal; }
  tbody tr:nth-child(even) { background: #faf3fb; }
  .note { color: var(--muted2); font-size: 13px; }
  .empty { color: var(--muted2); font-size: 15px; text-align: center; margin-top: 20px; }

  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 16px; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1040px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .panel { padding: 24px; }
    input[type=text] { font-size: 17px; padding: 13px 15px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .status { font-size: 15px; }
    .count { font-size: 15px; }
    .count .role-chip { font-size: 13.5px; padding: 4px 12px; }
    .office-name { font-size: 17.5px; }
    .office-total { font-size: 14.5px; }
    .role-chip { font-size: 13.5px; padding: 4px 12px; }
    .contract-badge { font-size: 13.5px; padding: 4px 12px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }
    .empty { font-size: 16px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>재직중 근무자</h1>
  <p class="sub">현재 재직중인 매니저 명단입니다.<br><span style="font-size:13px;">⭐ 표시는 계약만료일이 없는 무기계약·정직원입니다. 오늘 날짜 기준으로 이미 퇴사일이 지난 인원은 자동으로 제외됩니다.</span></p>

  <div class="panel">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="이름 또는 연락처로 검색" autocomplete="off">
    </div>
    <div class="branch-row" id="branchRow">
      <button type="button" class="branch-btn active" data-office="" onclick="selectOffice('')">전체</button>
    </div>
    <div class="role-row" id="roleRow">
      <button type="button" class="role-btn active" data-role="" onclick="selectRole('')">전체</button>
    </div>
    <div class="toolbar-row">
      <button type="button" class="excel-btn" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    </div>
    <div class="status" id="status">불러오는 중입니다...</div>
    <div class="count" id="count"></div>
    <div id="results"></div>
  </div>

  <div class="updated" id="updated"></div>
</div>

<script>
  var SHEET_ID = '1kQEUUWl9zFmd493YSopY2HxS4aAaGou_3Bar6G4fuqs';
  var GID_ACTIVE = '1812898646';

  // 승인 처리에 쓰는 것과 같은 Apps Script 웹앱 URL입니다. (배포 방법은 함께 전달된
  // "승인_기능_설정가이드.md" 문서를 참고하세요.)
  // 이 시트는 누군가 "필터"를 걸어두면 구글 gviz 조회 URL로는 필터링된 데이터만
  // 보이는 문제가 있어서, gviz 대신 이 백엔드를 거쳐 필터와 무관하게 항상 전체
  // 데이터를 가져옵니다.
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';

  // Column positions confirmed from the sheet (0-indexed, by column letter)
  var COL = {
    office: 0,      // A
    role: 1,         // B 구분
    dday: 2,         // C D데이
    name: 3,          // D 성명
    phone: 4,         // E 연락처
    hireDate: 5,      // F 입사일
    contractEnd: 15,  // P 계약기간 만료일
    contractTerm: 16, // Q 정해진 계약기간
    memberId: 19,     // T 사원번호
    resignDate: 20,        // U 퇴사일 (아직 재직중이어도 퇴사 예정일이 미리 적혀 있는 경우가 있습니다)
    employmentStatus: 21   // V 재직상태 ("재직"/"퇴사예정"/"퇴사" 등)
  };
  var DATA_START_ROW = 1;

  // Preferred display order for 구분 (role). Roles not listed here fall
  // after these, in the order they're first encountered.
  var ROLE_ORDER = ['배당', '검수', '1차검수', '발급', '발급/건수'];

  function roleRank(role) {
    var i = ROLE_ORDER.indexOf(role);
    return i === -1 ? ROLE_ORDER.length : i;
  }

  var allRows = [];
  var selectedOffice = '';
  var selectedRole = '';

  // 지점명에 괄호가 있으면("광주(전주)") 괄호 앞부분을 대표 지점명으로 사용합니다.
  // 지점 버튼은 이 대표 이름 기준으로 중복 없이 하나만 만들고, 그 버튼을 누르면
  // 괄호 안 표기를 포함한 모든 관련 행이 함께 보입니다. (표/엑셀에는 원본 텍스트 그대로 표시)
  function branchLabel(raw) {
    var s = (raw || '').trim();
    var idx = s.indexOf('(');
    return idx === -1 ? s : s.slice(0, idx).trim();
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parseDate(dateStr) {
    if (!dateStr) return null;
    var m = String(dateStr).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
    var t = Date.parse(dateStr);
    return isNaN(t) ? null : new Date(t);
  }

  // 시트에 적힌 재직상태 텍스트를 그대로 믿지 않고, 퇴사일과 오늘 날짜를 비교해서
  // 실제 상태를 판단합니다. (담당자가 바빠서 퇴사자 탭으로 옮기지 못했거나 재직상태
  // 텍스트를 갱신하지 못한 경우에도 이 목록에서 정확하게 제외되도록)
  //  - 퇴사일이 없음        → 재직 (label: '', excluded: false)
  //  - 퇴사일이 오늘보다 이후 → 퇴사예정 (excluded: false, 계속 포함)
  //  - 퇴사일이 오늘이거나 이전 → 퇴사 (excluded: true, 이 목록에서 제외)
  function getEffectiveStatus(resignDateStr) {
    var resign = parseDate(resignDateStr);
    if (!resign) return { label: '', excluded: false };
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    if (resign <= today) return { label: '퇴사', excluded: true };
    return { label: '퇴사예정', excluded: false };
  }

  // 계약만료일(P열) 칸에 실제 날짜가 아니라 "무기계약", "정직원"처럼 상태를 나타내는
  // 텍스트가 적혀 있으면, 헷갈리지 않도록 초록색 배지로 구분해서 보여줍니다.
  // 만약 P열(계약만료일)이 비어있고 대신 Q열(정해진 계약기간)에 "무기계약"/"정직원" 같은
  // 문구가 적혀 있는 경우에도 그 값을 그대로 배지로 보여줍니다.
  function isDateLike(s) {
    if (!s) return false;
    if (/\d{4}\D+\d{1,2}\D+\d{1,2}/.test(s)) return true;
    return !isNaN(Date.parse(s));
  }
  function renderContractEnd(row) {
    var end = (row[COL.contractEnd] || '').trim();
    if (end) {
      if (isDateLike(end)) return escapeHtml(end);
      return '<span class="contract-badge">🌿 ' + escapeHtml(end) + '</span>';
    }
    var term = (row[COL.contractTerm] || '').trim();
    if (term) {
      return '<span class="contract-badge">🌿 ' + escapeHtml(term) + '</span>';
    }
    return '';
  }

  // 계약만료일(P열)에 실제 날짜가 없는 사람은 무기계약/정직원으로 보고,
  // 성명 앞에 별 이모티콘을 붙여 표로 훑어볼 때 바로 구분되게 합니다.
  function isPermanentEmployee(row) {
    var end = (row[COL.contractEnd] || '').trim();
    return !(end && isDateLike(end));
  }

  // 필터 상태와 무관하게 항상 전체 데이터를 가져오기 위해, 구글 gviz 조회 URL
  // 대신 Apps Script 백엔드(action=getSheetData)를 거쳐서 읽습니다.
  function fetchSheet(gid, onDone, onError) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);

    fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      if (!data || !data.ok) {
        throw new Error((data && data.error) || '시트 응답 오류');
      }
      onDone(data.rows);
    }).catch(function(err) {
      onError(err instanceof Error ? err : new Error(String(err)));
    });
  }

  function populateOfficeFilter() {
    var offices = {};
    allRows.forEach(function(r) {
      var o = branchLabel(r[COL.office]);
      if (o) offices[o] = true;
    });
    var row = document.getElementById('branchRow');
    Object.keys(offices).sort(function(a, b) { return a.localeCompare(b, 'ko'); }).forEach(function(o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'branch-btn';
      btn.setAttribute('data-office', o);
      btn.textContent = o;
      btn.onclick = function() { selectOffice(o); };
      row.appendChild(btn);
    });
  }

  function selectOffice(office) {
    selectedOffice = office;
    document.querySelectorAll('.branch-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-office') === office);
    });
    selectedRole = '';
    populateRoleFilter();
    render();
  }

  function populateRoleFilter() {
    var row = document.getElementById('roleRow');
    row.innerHTML = '<button type="button" class="role-btn active" data-role="" onclick="selectRole(\'\')">전체</button>';
    var roles = {};
    allRows.forEach(function(r) {
      if (selectedOffice && branchLabel(r[COL.office]) !== selectedOffice) return;
      var role = (r[COL.role] || '').trim();
      if (role) roles[role] = true;
    });
    Object.keys(roles).sort(function(a, b) {
      var d = roleRank(a) - roleRank(b);
      return d !== 0 ? d : a.localeCompare(b);
    }).forEach(function(role) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-btn';
      btn.setAttribute('data-role', role);
      btn.textContent = role;
      btn.onclick = function() { selectRole(role); };
      row.appendChild(btn);
    });
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-role') === role);
    });
    render();
  }

  function buildCountLine(filtered) {
    var roleCounts = {};
    var roleOrder = [];
    filtered.forEach(function(r) {
      var role = (r[COL.role] || '').trim() || '미분류';
      if (!roleCounts[role]) { roleCounts[role] = 0; roleOrder.push(role); }
      roleCounts[role]++;
    });
    roleOrder.sort(function(a, b) {
      var d = roleRank(a) - roleRank(b);
      return d !== 0 ? d : a.localeCompare(b);
    });

    var html = '<span class="total">총 ' + filtered.length + '명</span>';
    roleOrder.forEach(function(role) {
      html += '<span class="role-chip">' + escapeHtml(role) + ' <b>' + roleCounts[role] + '</b></span>';
    });
    return html;
  }

  function getFilteredRows() {
    var q = document.getElementById('searchInput').value.trim();

    return allRows.filter(function(r) {
      if (selectedOffice && branchLabel(r[COL.office]) !== selectedOffice) return false;
      if (selectedRole && (r[COL.role] || '').trim() !== selectedRole) return false;
      if (!q) return true;
      var name = (r[COL.name] || '');
      var phone = (r[COL.phone] || '');
      return name.indexOf(q) !== -1 || phone.replace(/[^0-9]/g, '').indexOf(q.replace(/[^0-9]/g, '')) !== -1 && q.replace(/[^0-9]/g,'').length > 0;
    });
  }

  function render() {
    var container = document.getElementById('results');

    var filtered = getFilteredRows();

    document.getElementById('count').innerHTML = buildCountLine(filtered);

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty">조건에 맞는 근무자가 없습니다.</div>';
      return;
    }

    // Group by office, preserving first-seen order; sort groups by name.
    var groups = {};
    var groupOrder = [];
    filtered.forEach(function(r) {
      var o = (r[COL.office] || '').trim() || '지점 미상';
      if (!groups[o]) { groups[o] = []; groupOrder.push(o); }
      groups[o].push(r);
    });
    groupOrder.sort();

    var html = '';
    groupOrder.forEach(function(o) {
      var rows = groups[o];

      // Count by role (구분) within this office.
      var roleCounts = {};
      var roleOrder = [];
      rows.forEach(function(r) {
        var role = (r[COL.role] || '').trim() || '미분류';
        if (!roleCounts[role]) { roleCounts[role] = 0; roleOrder.push(role); }
        roleCounts[role]++;
      });
      roleOrder.sort(function(a, b) {
        var d = roleRank(a) - roleRank(b);
        return d !== 0 ? d : a.localeCompare(b);
      });

      // Sort rows by the same role priority; keep original relative order within a role.
      rows = rows.slice().sort(function(a, b) {
        var ra = (a[COL.role] || '').trim() || '미분류';
        var rb = (b[COL.role] || '').trim() || '미분류';
        var d = roleRank(ra) - roleRank(rb);
        if (d !== 0) return d;
        return ra === rb ? 0 : ra.localeCompare(rb);
      });

      html += '<div class="office-group">';
      html += '<div class="office-header">';
      html += '<span class="office-name">' + escapeHtml(o) + '</span>';
      html += '<span class="office-total">총 ' + rows.length + '명</span>';
      html += '<div class="role-breakdown">';
      roleOrder.forEach(function(role) {
        html += '<span class="role-chip">' + escapeHtml(role) + ' <b>' + roleCounts[role] + '</b></span>';
      });
      html += '</div>';
      html += '</div>';

      html += '<div class="table-scroll"><table><thead><tr>';
      html += '<th>구분</th><th>성명</th><th>연락처</th><th>입사일</th><th>계약만료일</th><th>퇴사일</th><th>재직상태</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(function(r) {
        // 오늘 날짜 기준으로 계산된 값입니다(getEffectiveStatus). 이미 퇴사한 사람은
        // 이 목록 자체에서 제외되므로, 여기서는 '' 또는 '퇴사예정'만 나타납니다.
        var statusLabel = getEffectiveStatus(r[COL.resignDate]).label;
        html += '<tr>';
        html += '<td>' + escapeHtml(r[COL.role] || '') + '</td>';
        html += '<td><b>' + (isPermanentEmployee(r) ? '⭐ ' : '') + escapeHtml(r[COL.name] || '') + '</b></td>';
        html += '<td>' + escapeHtml(r[COL.phone] || '') + '</td>';
        html += '<td>' + escapeHtml(r[COL.hireDate] || '') + '</td>';
        html += '<td>' + renderContractEnd(r) + '</td>';
        html += '<td>' + escapeHtml(r[COL.resignDate] || '') + '</td>';
        html += '<td>' + (statusLabel ? '<span class="status-badge">' + statusLabel + '</span>' : '') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  function loadAll() {
    setStatus('불러오는 중입니다...');
    fetchSheet(GID_ACTIVE, function(rows) {
      allRows = rows.slice(DATA_START_ROW).filter(function(r) {
        if (!r[COL.name] || r[COL.name].trim().length === 0) return false;
        // 오늘 날짜 기준으로 이미 퇴사일이 지난 사람은 재직중 명단에서 제외합니다.
        // (퇴사자 탭으로 아직 옮겨지지 않았어도 동일하게 적용됩니다.)
        return !getEffectiveStatus(r[COL.resignDate]).excluded;
      });
      setStatus('');
      populateOfficeFilter();
      populateRoleFilter();
      render();
      document.getElementById('updated').textContent = '조회 시각: ' + new Date().toLocaleString('ko-KR');
    }, function(err) {
      setStatus('오류: ' + err.message);
    });
  }

  function downloadExcel() {
    var rows = getFilteredRows();
    if (rows.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['지점', '구분', '성명', '연락처', '입사일', '계약만료일/구분', '퇴사일', '재직상태']];
    rows.forEach(function(r) {
      var endText = (r[COL.contractEnd] || '').trim() || (r[COL.contractTerm] || '').trim();
      var statusLabel = getEffectiveStatus(r[COL.resignDate]).label;
      aoa.push([
        r[COL.office] || '', r[COL.role] || '',
        (isPermanentEmployee(r) ? '⭐ ' : '') + (r[COL.name] || ''),
        r[COL.phone] || '', r[COL.hireDate] || '', endText,
        r[COL.resignDate] || '', statusLabel
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '재직중근무자');
    var stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, '재직중_근무자_' + stamp + '.xlsx');
  }

  document.getElementById('searchInput').addEventListener('input', render);

  loadAll();
</script>
</body>
</html>
