<style>
  :root {

</style>

<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>휴가 승인관리</h1>
  <p class="sub">승인 대기 중인 휴가 신청 목록입니다. 승인 후 시트의 "승인상태" 칸에 직접 표시해주세요.</p>

  <div class="toolbar">
    <button type="button" class="refresh" onclick="loadAll()">새로고침</button>
  </div>
  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<!-- 반려 사유 입력 팝업 -->
<div class="modal-overlay" id="rejectModal" onclick="if(event.target===this) closeRejectModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rejectTitle">
    <h2 id="rejectTitle">휴가 반려</h2>
    <div class="modal-info" id="rejectInfo"></div>
    <textarea id="rejectReason" maxlength="200" placeholder="반려 사유를 구체적으로 입력해주세요. (5자 이상)&#10;신청자에게 그대로 전달됩니다."></textarea>
    <div class="modal-count"><span id="rejectCount">0</span> / 200</div>
    <div class="modal-error" id="rejectError"></div>
    <div class="modal-actions">
      <button type="button" class="reject-btn" onclick="closeRejectModal()">취소</button>
      <button type="button" class="approve-btn" id="rejectSubmitBtn" onclick="submitReject()">반려하기</button>
    </div>
  </div>
</div>

<script>
  var SHEET_ID = '1X3LpMT3fl7AoIPPPNwces5UK4-uWxEkuDBkRX6BWvAE';
  var GID_INFO = '578655642';
  var GID_HISTORY = '713963883';

  // 승인 처리를 담당하는 Google Apps Script 웹앱 URL을 여기에 붙여넣으세요.
  // (배포 방법은 함께 전달된 "승인_기능_설정가이드.md" 문서를 참고하세요.)
  var APPROVE_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';

  // 헤더 이름으로 컬럼 위치를 자동으로 찾습니다. 시트에 컬럼이 추가/삭제/이동되어도
  // 이 코드를 매번 고치지 않도록, 고정된 열 번호 대신 시트의 실제 헤더(항목명)
  // 텍스트를 기준으로 위치를 찾습니다. 헤더 행 자체도 고정된 행 번호가 아니라,
  // 아래 HEADER_LABELS 항목들이 가장 많이 일치하는 행을 헤더 행으로 자동 인식합니다.
  // (참고: 이 시트는 1행이 별도 용도이고, 실제 항목명은 2행에 있습니다.)
  var HEADER_LABELS = {
    memberId: '회원번호', branch: '지점', role: '업무구분', name: '직원명',
    phone: '연락처', employmentStatus: '재직상태'
  };
  var COL_INFO = null;         // findHeaderRow_()가 채웁니다.
  var INFO_DATA_START_ROW = 0; // findHeaderRow_()가 채웁니다.

  // rows 안에서 헤더 행을 찾아 { colMap: {필드명: 열 번호}, dataStartRow: 숫자 }를
  // 반환합니다. HEADER_LABELS 중 절반 이상이 일치하는 첫 번째 행을 헤더 행으로
  // 인정합니다. 못 찾으면 null을 반환합니다.
  function findHeaderRow_(rows) {
    var keys = Object.keys(HEADER_LABELS);
    var needed = Math.ceil(keys.length / 2);
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var map = {};
      var found = 0;
      keys.forEach(function(key) {
        var idx = row.indexOf(HEADER_LABELS[key]);
        if (idx !== -1) { map[key] = idx; found++; }
      });
      if (found >= needed) return { colMap: map, dataStartRow: r + 1 };
    }
    return null;
  }

  var COL_HIST = {
    branch: 1, role: 2, name: 3, memberId: 4,
    startDate: 5, endDate: 6, days: 7, type: 8, note: 9, approveStatus: 10
  };
  var HIST_DATA_START_ROW = 1;

  var infoRows = null;
  var histRows = null;

  function setStatus(msg) {
    document.getElementById('status').textContent = msg || '';
  }

  // 시트에 누군가 일반 "필터"를 걸어도 항상 전체 데이터를 보도록, 구글 gviz 대신
  // Apps Script 백엔드(action=getSheetData)를 거쳐 읽습니다. (Code.gs의 ALLOWED_READ_SHEETS에 등록된 탭만 허용)
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';
  function fetchSheet(gid, onDone, onError, headersCount) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      clearTimeout(timer);
      if (!data || !data.ok) throw new Error((data && data.error) || '시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err) {
      clearTimeout(timer);
      onError(err && err.name === 'AbortError' ? new Error('응답 시간이 초과되었습니다.') : (err instanceof Error ? err : new Error(String(err))));
    });
  }

  function loadAll() {
    setStatus('불러오는 중입니다...');
    document.getElementById('results').innerHTML = '';

    var pending = 2, failed = false;
    function checkDone() {
      pending--;
      if (pending === 0 && !failed) {
        setStatus('');
        render();
      }
    }
    function fail(err) {
      if (failed) return;
      failed = true;
      setStatus('오류: ' + err.message);
    }

    fetchSheet(GID_INFO, function(rows) {
      var header = findHeaderRow_(rows);
      if (!header) {
        fail(new Error('사원정보 시트에서 헤더(항목명) 행을 찾지 못했습니다.'));
        return;
      }
      COL_INFO = header.colMap;
      INFO_DATA_START_ROW = header.dataStartRow;
      infoRows = rows.slice(INFO_DATA_START_ROW).filter(function(row) {
        return row[COL_INFO.name] && row[COL_INFO.name].trim().length > 0;
      });
      checkDone();
    }, fail);

    fetchSheet(GID_HISTORY, function(rows) {
      // rows[i]는 시트의 (i+1)번째 행과 그대로 대응합니다 (headers=0 옵션 사용).
      // 승인 처리 시 정확한 행에 기록하기 위해 실제 시트 행 번호(sheetRow)를 함께 저장해둡니다.
      var list = [];
      for (var i = HIST_DATA_START_ROW; i < rows.length; i++) {
        var row = rows[i];
        if (row[COL_HIST.name] && row[COL_HIST.name].trim().length > 0 && row[COL_HIST.startDate] && row[COL_HIST.startDate].trim().length > 0) {
          list.push({ cells: row, sheetRow: i + 1 });
        }
      }
      histRows = list;
      checkDone();
    }, fail);
  }

  function tagClass(type) {
    var t = (type || '').trim();
    if (t.indexOf('월차') !== -1) return 'tag-month';
    if (t.indexOf('연차') !== -1) return 'tag-annual';
    return 'tag-etc';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function findPhoneByMemberId(memberId) {
    for (var i = 0; i < infoRows.length; i++) {
      if ((infoRows[i][COL_INFO.memberId] || '').trim() === memberId) {
        return infoRows[i][COL_INFO.phone] || '';
      }
    }
    return '';
  }

  function render() {
    var container = document.getElementById('results');

    var pendingRequests = histRows.filter(function(entry) {
      var st = (entry.cells[COL_HIST.approveStatus] || '').trim();
      return st.length === 0;
    });

    if (pendingRequests.length === 0) {
      container.innerHTML = '<div class="empty">승인 대기 중인 신청이 없습니다.</div>';
      return;
    }

    var html = '';
    pendingRequests.forEach(function(entry, idx) {
      var row = entry.cells;
      var name = row[COL_HIST.name] || '';
      var branch = row[COL_HIST.branch] || '';
      var start = row[COL_HIST.startDate] || '';
      var end = row[COL_HIST.endDate] || '';
      var days = row[COL_HIST.days] || '';
      var type = row[COL_HIST.type] || '';
      var note = row[COL_HIST.note] || '';
      var memberId = (row[COL_HIST.memberId] || '').trim();
      var phone = memberId ? findPhoneByMemberId(memberId) : '';

      var message = name + '님, ' + start + ' ~ ' + end + ' ' + type + ' (' + days + '일) 신청이 승인되었습니다.  담당 배당매니저님께도 전달해 주시기바랍니다.';

      html += '<div class="card">';
      html += '<div class="card-top"><span class="card-name">' + escapeHtml(name) + '</span><span class="card-branch">' + escapeHtml(branch) + '</span></div>';
      html += '<div class="card-row"><b>기간</b> ' + escapeHtml(start) + ' ~ ' + escapeHtml(end) + ' (' + escapeHtml(days) + '일)</div>';
      html += '<div class="card-row"><b>종류</b> <span class="tag ' + tagClass(type) + '">' + escapeHtml(type) + '</span></div>';
      if (note) html += '<div class="note">' + escapeHtml(note) + '</div>';

      html += '<div class="meta" style="margin-top:10px; padding:10px; background:#faf3fb; border:1px solid var(--line); border-radius:10px;">' + escapeHtml(message) + '</div>';

      html += '<div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">';
      html += '<div style="display:flex; gap:8px;">';
      html += '<button type="button" class="approve-btn" style="flex:1; margin-top:0;" id="approve-btn-' + idx + '" onclick="approveRequest(' + idx + ')">✅ 승인하기</button>';
      html += '<button type="button" class="reject-btn" style="flex:1;" id="reject-btn-' + idx + '" onclick="openRejectModal(' + idx + ')">❌ 반려하기</button>';
      html += '</div>';
      if (phone) {
        html += '<div style="display:flex; gap:8px;">';
        html += '<button type="button" class="approve-btn" style="flex:1; background:#fff; color:var(--accent);" onclick="copyPhone(' + idx + ')">전화번호 복사</button>';
        html += '<button type="button" class="approve-btn" style="flex:1; background:#fff; color:var(--warn); border-color:var(--warn);" onclick="copyMessage(' + idx + ')">메시지 복사</button>';
        html += '</div>';
      } else {
        html += '<div class="no-phone">연락처를 찾을 수 없어 메시지를 보낼 수 없습니다.</div>';
      }
      html += '</div>';
      html += '</div>';
    });

    container.innerHTML = html;

    // Stash data for the button handlers (승인 / 전화번호 복사 / 메시지 복사)
    window.__pendingRequests = pendingRequests.map(function(entry) {
      var row = entry.cells;
      var name = row[COL_HIST.name] || '';
      var branch = row[COL_HIST.branch] || '';
      var start = row[COL_HIST.startDate] || '';
      var end = row[COL_HIST.endDate] || '';
      var days = row[COL_HIST.days] || '';
      var type = row[COL_HIST.type] || '';
      var memberId = (row[COL_HIST.memberId] || '').trim();
      var phone = memberId ? findPhoneByMemberId(memberId) : '';
      return {
        sheetRow: entry.sheetRow,
        memberId: memberId,
        name: name, branch: branch, startDate: start, endDate: end, days: days, type: type,
        message: name + '님, ' + start + ' ~ ' + end + ' ' + type + ' (' + days + '일) 신청이 승인되었습니다.  담당 배당매니저님께도 전달해 주시기바랍니다.',
        phone: phone
      };
    });
  }

  function approveRequest(idx) {
    var item = window.__pendingRequests && window.__pendingRequests[idx];
    if (!item) return;

    // 공백/따옴표가 실수로 섞여 붙여넣어진 경우까지 감안해 URL을 정리합니다.
    var approveUrl = String(APPROVE_WEBAPP_URL || '').trim().replace(/^['"]|['"]$/g, '');
    console.log('[승인관리] 현재 등록된 APPROVE_WEBAPP_URL:', JSON.stringify(approveUrl));

    if (!approveUrl || approveUrl.indexOf('http') !== 0) {
      setStatus('승인 기능이 아직 연결되지 않았습니다. 설정 가이드를 참고해 웹앱 URL을 등록해주세요.');
      return;
    }

    var btn = document.getElementById('approve-btn-' + idx);
    if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }
    setStatus('승인 처리 중입니다...');

    fetch(approveUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'approve',
        sheetRow: item.sheetRow,
        memberId: item.memberId,
        name: item.name,
        branch: item.branch,
        startDate: item.startDate,
        endDate: item.endDate,
        days: item.days,
        type: item.type
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) {
          setStatus(item.name + '님의 휴가가 승인되었습니다. ✅');
          loadAll();
        } else {
          setStatus('오류: ' + (data && data.error ? data.error : '승인에 실패했습니다.'));
          if (btn) { btn.disabled = false; btn.textContent = '✅ 승인하기'; }
        }
      })
      .catch(function(err) {
        setStatus('승인 요청 중 오류가 발생했습니다: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = '✅ 승인하기'; }
      });
  }

  // ---------------------------------------------------------------
  // 반려 처리: 사유 입력 팝업 → 확인창 → action:'reject' 요청
  // (사유 검사는 Code.gs의 validateRejectReason_와 같은 규칙이고, 서버에서도 한 번 더 검사합니다.)
  // ---------------------------------------------------------------
  function normalizeReason_(s) {
    return String(s || '').replace(/\s+/g, ' ').trim();
  }

  function validateReason_(reason) {
    var compact = reason.replace(/\s+/g, '');
    if (!compact) return '반려 사유를 입력해주세요.';
    if (compact.length < 5) return '반려 사유는 최소 5자 이상 구체적으로 입력해주세요.';
    if (reason.length > 200) return '반려 사유는 200자 이내로 입력해주세요.';
    if (!/[가-힣A-Za-z0-9]/.test(compact)) return '반려 사유에 글자나 숫자가 포함되어야 해요.';
    if (/^[ㄱ-ㅎㅏ-ㅣ]+$/.test(compact)) return '자음/모음만으로는 사유를 입력할 수 없어요. 문장으로 적어주세요.';
    var uniq = {}, n = 0;
    compact.split('').forEach(function(ch) { if (!uniq[ch]) { uniq[ch] = true; n++; } });
    if (n < 3) return '같은 글자만 반복된 사유는 입력할 수 없어요. 반려 이유를 구체적으로 적어주세요.';
    return '';
  }

  function openRejectModal(idx) {
    var item = window.__pendingRequests && window.__pendingRequests[idx];
    if (!item) return;
    window.__rejectTarget = item;
    document.getElementById('rejectInfo').textContent =
      item.name + ' (' + item.branch + ') · ' + item.startDate + ' ~ ' + item.endDate + ' · ' + item.type + ' ' + item.days + '일';
    var ta = document.getElementById('rejectReason');
    ta.value = '';
    document.getElementById('rejectCount').textContent = '0';
    document.getElementById('rejectError').textContent = '';
    var sb = document.getElementById('rejectSubmitBtn');
    sb.disabled = false; sb.textContent = '반려하기';
    document.getElementById('rejectModal').classList.add('open');
    setTimeout(function() { ta.focus(); }, 50);
  }

  function closeRejectModal() {
    document.getElementById('rejectModal').classList.remove('open');
    window.__rejectTarget = null;
  }

  document.addEventListener('input', function(e) {
    if (e.target && e.target.id === 'rejectReason') {
      document.getElementById('rejectCount').textContent = String(e.target.value.length);
      document.getElementById('rejectError').textContent = '';
    }
  });

  function submitReject() {
    var item = window.__rejectTarget;
    if (!item) return;
    var errEl = document.getElementById('rejectError');
    var reason = normalizeReason_(document.getElementById('rejectReason').value);
    var msg = validateReason_(reason);
    if (msg) { errEl.textContent = msg; return; }

    if (!confirm(item.name + '님의 휴가(' + item.startDate + ' ~ ' + item.endDate + ')를 반려합니다.\n\n사유: ' + reason + '\n\n진행할까요?')) return;

    var url = String(APPROVE_WEBAPP_URL || '').trim().replace(/^['"]|['"]$/g, '');
    if (!url || url.indexOf('http') !== 0) {
      errEl.textContent = '반려 기능이 아직 연결되지 않았습니다. 웹앱 URL을 확인해주세요.';
      return;
    }

    var sb = document.getElementById('rejectSubmitBtn');
    sb.disabled = true; sb.textContent = '처리 중...';
    errEl.textContent = '';

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'reject',
        sheetRow: item.sheetRow,
        memberId: item.memberId,
        reason: reason
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.ok) {
          closeRejectModal();
          setStatus(item.name + '님의 휴가가 반려되었습니다. ❌');
          loadAll();
        } else {
          errEl.textContent = (data && data.error) ? data.error : '반려에 실패했습니다.';
          sb.disabled = false; sb.textContent = '반려하기';
        }
      })
      .catch(function(err) {
        errEl.textContent = '반려 요청 중 오류가 발생했습니다: ' + err.message;
        sb.disabled = false; sb.textContent = '반려하기';
      });
  }

  function copyToClipboard(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        setStatus(label + ' 복사되었습니다.');
      }).catch(function() {
        fallbackCopy(text, label);
      });
    } else {
      fallbackCopy(text, label);
    }
  }

  function fallbackCopy(text, label) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      setStatus(label + ' 복사되었습니다.');
    } catch (e) {
      prompt('아래 내용을 복사해주세요:', text);
    }
    document.body.removeChild(ta);
  }

  function copyPhone(idx) {
    var item = window.__pendingRequests[idx];
    if (!item || !item.phone) return;
    copyToClipboard(item.phone, '전화번호가');
  }

  function copyMessage(idx) {
    var item = window.__pendingRequests[idx];
    if (!item) return;
    copyToClipboard(item.message, '메시지가');
  }

  loadAll();
</script>
</body>
</html>
