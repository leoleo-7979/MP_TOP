<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileImage" content="mstile-150x150.png">
<meta name="msapplication-TileColor" content="#0a080e">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>잔여휴가 모아보기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    table { font-size: 13.5px; }
    thead th, tbody td { padding: 8px 10px; }
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 20px; text-align: center; }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08); margin-bottom: 18px;
  }
  .controls { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select {
    font-size: 15px; padding: 12px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: #fdf9fe; color: var(--ink); font-family: var(--sans);
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tab-row { display: flex; gap: 8px; }
  .tab-btn {
    flex: 1; font-family: var(--sans); font-size: 15px; font-weight: 700;
    padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }
  .excel-btn:disabled { background: var(--muted2); cursor: not-allowed; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 12px 0; min-height: 18px; }
  .count { font-size: 13.5px; color: var(--muted); margin: 4px 2px 0; text-align: center; }
  .empty { color: var(--muted2); font-size: 15px; text-align: center; margin-top: 24px; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #faf3fb; }

  .annual-badge {
    display: inline-block; padding: 3px 11px; border-radius: 14px;
    font-size: 13px; font-weight: 800; background: var(--accent-soft); color: var(--accent);
  }
  .monthly-badge {
    display: inline-block; padding: 3px 11px; border-radius: 14px;
    font-size: 13px; font-weight: 800; background: #fbe4ec; color: var(--warn);
  }

  .office-group { margin-top: 22px; }
  .office-group:first-of-type { margin-top: 6px; }
  .office-header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 11px 13px; background: var(--accent-soft); border-radius: 10px 10px 0 0;
  }
  .office-name { font-size: 16px; font-weight: 800; color: var(--accent); }
  .office-total { font-size: 13.5px; font-weight: 700; color: var(--accent); }

  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 20px; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1000px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .panel { padding: 24px; }
    input[type=text] { font-size: 17px; padding: 13px 15px; }
    select { font-size: 15.5px; padding: 13px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .status { font-size: 15px; }
    .count { font-size: 14.5px; }
    .empty { font-size: 16px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }
    .annual-badge, .monthly-badge { font-size: 13.5px; padding: 4px 12px; }
    .office-name { font-size: 17.5px; }
    .office-total { font-size: 14.5px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>잔여휴가 모아보기</h1>
  <p class="sub">지점별로 매니저의 잔여 월차·연차를 보여줍니다. (기본은 재직자, 퇴사자는 퇴사일 기준 잔여) (건수제·프리랜서 매니저는 휴가가 생성되지 않아 제외됩니다)</p>

  <div class="panel">
    <div class="controls">
      <select id="statusFilter" onchange="render()" style="font-size:15px; padding:11px; border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:8px; width:100%;">
        <option value="active">재직자</option><option value="all">전체</option><option value="resigned">퇴사자</option>
      </select>
      <input type="text" id="searchInput" placeholder="이름 또는 전화번호로 검색" autocomplete="off">
    </div>
    <div class="branch-row" id="branchRow">
      <button type="button" class="branch-btn active" data-office="" onclick="selectOffice('')">전체</button>
    </div>
    <div class="role-row" id="roleRow">
      <button type="button" class="role-btn active" data-role="" onclick="selectRole('')">전체</button>
    </div>
    <div class="toolbar-row">
      <button type="button" class="excel-btn" id="excelBtn" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    </div>
    <div class="status" id="status">불러오는 중입니다...</div>
    <div class="count" id="count"></div>
  </div>

  <div id="results"></div>
  <div class="updated" id="updated"></div>
</div>

<script>
  var SHEET_ID = '1X3LpMT3fl7AoIPPPNwces5UK4-uWxEkuDBkRX6BWvAE';
  var GID_INFO = '578655642'; // 사원정보 탭

  // 헤더 이름으로 컬럼 위치를 자동으로 찾습니다. 시트에 컬럼이 추가/삭제/이동되어도
  // 이 코드를 매번 고치지 않도록, 고정된 열 번호 대신 시트의 실제 헤더(항목명)
  // 텍스트를 기준으로 위치를 찾습니다. 헤더 행 자체도 고정된 행 번호가 아니라,
  // 아래 HEADER_LABELS 항목들이 가장 많이 일치하는 행을 헤더 행으로 자동 인식합니다.
  // (참고: 이 시트는 1행이 별도 용도이고, 실제 항목명은 2행에 있습니다.)
  var HEADER_LABELS = {
    memberId: '회원번호', branch: '지점', role: '업무구분', name: '직원명',
    hireDate: '입사일', resignDate: '퇴사일', employmentStatus: '재직상태',
    phone: '연락처', monthly: '잔여 월차 수', annual: '잔여 연차 수'
  };
  var COL_INFO = null;         // findHeaderRow_()가 채웁니다.
  var INFO_DATA_START_ROW = 0; // findHeaderRow_()가 채웁니다.

  // rows 안에서 헤더 행을 찾아 { colMap: {필드명: 열 번호}, dataStartRow: 숫자 }를
  // 반환합니다. HEADER_LABELS 중 절반 이상이 일치하는 첫 번째 행을 헤더 행으로
  // 인정합니다. 못 찾으면 null을 반환합니다.
  function findHeaderRow_(rows) {
    var keys = Object.keys(HEADER_LABELS);
    var needed = Math.ceil(keys.length / 2);
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var map = {};
      var found = 0;
      keys.forEach(function(key) {
        var idx = row.indexOf(HEADER_LABELS[key]);
        if (idx !== -1) { map[key] = idx; found++; }
      });
      if (found >= needed) return { colMap: map, dataStartRow: r + 1 };
    }
    return null;
  }

  var allRows = [];
  var GID_HISTORY = '628017033'; // 휴가사용내역 탭 (퇴사자 잔여 계산용, 고정 열)
  var COL_HIST = { memberId: 4, name: 3, startDate: 5, days: 7, type: 8 };
  var histRows = [];

  function parseYMD(s) {
    var m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10)) : null;
  }
  function monthlyEarnedUntil(hire, end) {
    if (!hire || !end || end < hire) return 0;
    var n = 0;
    for (var k = 1; k <= 11; k++) {
      var d = new Date(hire.getFullYear(), hire.getMonth() + k, hire.getDate());
      if (d.getDate() !== hire.getDate()) d = new Date(hire.getFullYear(), hire.getMonth() + k + 1, 0);
      if (d <= end) n++; else break;
    }
    return n;
  }
  // 대시보드와 같은 기준: 퇴사일이 오늘 이전/당일이면 퇴사, 오늘 이후(퇴사예정)는 아직 재직중.
  function isResigned(r) {
    var d = parseYMD(r[COL_INFO.resignDate]);
    if (d) { var t = new Date(); t.setHours(0,0,0,0); return d <= t; }
    var st = (COL_INFO.employmentStatus !== undefined ? (r[COL_INFO.employmentStatus] || '') : '');
    return st.indexOf('퇴사') !== -1 && st.indexOf('예정') === -1;
  }
  // 퇴사자는 퇴사일 기준으로 고정된 잔여를 계산합니다 (월차 발생 − 사용, 1년 미만이면 연차 0).
  function balanceOf(r) {
    if (!isResigned(r)) return { monthly: r[COL_INFO.monthly] || '0', annual: r[COL_INFO.annual] || '0' };
    var hd = parseYMD(r[COL_INFO.hireDate]), rd = parseYMD(r[COL_INFO.resignDate]);
    var id = (r[COL_INFO.memberId] || '').trim(), name = (r[COL_INFO.name] || '').trim();
    var used = 0;
    histRows.forEach(function(h) {
      var same = id ? (h[COL_HIST.memberId] || '').trim() === id : (h[COL_HIST.name] || '').trim() === name;
      if (!same || (h[COL_HIST.type] || '').indexOf('월차') === -1) return;
      var d = parseYMD(h[COL_HIST.startDate]);
      if (d && ((hd && d < hd) || (rd && d > rd))) return;
      used += parseFloat(h[COL_HIST.days]) || 0;
    });
    var oneYear = hd ? new Date(hd.getFullYear() + 1, hd.getMonth(), hd.getDate()) : null;
    var under1 = !!(rd && oneYear && rd < oneYear);
    return { monthly: String(Math.max(0, monthlyEarnedUntil(hd, rd) - used)), annual: under1 ? '0' : (r[COL_INFO.annual] || '0') };
  }
  var selectedOffice = '';
  var selectedRole = '';

  // 지점명에 괄호가 있으면("광주(전주)") 괄호 앞부분을 대표 지점명으로 사용합니다.
  // 지점 버튼은 이 대표 이름 기준으로 중복 없이 하나만 만들고, 그 버튼을 누르면
  // 괄호 안 표기를 포함한 모든 관련 행이 함께 보입니다. (표/엑셀에는 원본 텍스트 그대로 표시)
  function branchLabel(raw) {
    var s = (raw || '').trim();
    var idx = s.indexOf('(');
    return idx === -1 ? s : s.slice(0, idx).trim();
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 시트에 누군가 일반 "필터"를 걸어도 항상 전체 데이터를 보도록, 구글 gviz 대신
  // Apps Script 백엔드(action=getSheetData)를 거쳐 읽습니다. (Code.gs의 ALLOWED_READ_SHEETS에 등록된 탭만 허용)
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';
  function fetchSheet(gid, onDone, onError, headersCount) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      clearTimeout(timer);
      if (!data || !data.ok) throw new Error((data && data.error) || '시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err) {
      clearTimeout(timer);
      onError(err && err.name === 'AbortError' ? new Error('응답 시간이 초과되었습니다.') : (err instanceof Error ? err : new Error(String(err))));
    });
  }

  function populateOfficeFilter() {
    var offices = {};
    allRows.forEach(function(r) {
      var o = branchLabel(r[COL_INFO.branch]);
      if (o) offices[o] = true;
    });
    var row = document.getElementById('branchRow');
    Object.keys(offices).sort(function(a, b) { return a.localeCompare(b, 'ko'); }).forEach(function(o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'branch-btn';
      btn.setAttribute('data-office', o);
      btn.textContent = o;
      btn.onclick = function() { selectOffice(o); };
      row.appendChild(btn);
    });
  }

  function selectOffice(office) {
    selectedOffice = office;
    document.querySelectorAll('.branch-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-office') === office);
    });
    selectedRole = '';
    populateRoleFilter();
    render();
  }

  function populateRoleFilter() {
    var row = document.getElementById('roleRow');
    row.innerHTML = '<button type="button" class="role-btn active" data-role="" onclick="selectRole(\'\')">전체</button>';
    var roles = {};
    allRows.forEach(function(r) {
      if (selectedOffice && branchLabel(r[COL_INFO.branch]) !== selectedOffice) return;
      var role = (r[COL_INFO.role] || '').trim();
      if (role) roles[role] = true;
    });
    Object.keys(roles).sort().forEach(function(role) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-btn';
      btn.setAttribute('data-role', role);
      btn.textContent = role;
      btn.onclick = function() { selectRole(role); };
      row.appendChild(btn);
    });
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-role') === role);
    });
    render();
  }

  function getFilteredRows() {
    var q = document.getElementById('searchInput').value.trim();
    var qDigits = q.replace(/[^0-9]/g, '');

    return allRows.filter(function(r) {
      var hasPhone = (r[COL_INFO.phone] || '').trim().length > 0;
      var role = (r[COL_INFO.role] || '').trim();
      var isFreelanceType = role.indexOf('건수') !== -1 || role.indexOf('프리랜서') !== -1;
      if (!hasPhone || isFreelanceType) return false;
      var sf = document.getElementById('statusFilter').value;
      if (sf !== 'all' && (sf === 'resigned') !== isResigned(r)) return false;
      if (selectedOffice && branchLabel(r[COL_INFO.branch]) !== selectedOffice) return false;
      if (selectedRole && role !== selectedRole) return false;
      if (q) {
        var name = r[COL_INFO.name] || '';
        var phone = r[COL_INFO.phone] || '';
        var nameMatch = name.indexOf(q) !== -1;
        var phoneMatch = qDigits.length > 0 && phone.replace(/[^0-9]/g, '').indexOf(qDigits) !== -1;
        if (!nameMatch && !phoneMatch) return false;
      }
      return true;
    });
  }

  function render() {
    var container = document.getElementById('results');

    var matches = getFilteredRows();

    document.getElementById('count').textContent = '총 ' + matches.length + '명';

    if (matches.length === 0) {
      container.innerHTML = '<div class="empty">해당하는 매니저가 없습니다.</div>';
      return;
    }

    // Group by office (지점), preserving a sorted group order.
    var groups = {};
    var groupOrder = [];
    matches.forEach(function(r) {
      var office = (r[COL_INFO.branch] || '').trim() || '지점 미상';
      if (!groups[office]) { groups[office] = []; groupOrder.push(office); }
      groups[office].push(r);
    });
    groupOrder.sort();
    groupOrder.forEach(function(office) {
      groups[office].sort(function(a, b) {
        return (a[COL_INFO.name] || '').localeCompare(b[COL_INFO.name] || '');
      });
    });

    var html = '';
    groupOrder.forEach(function(office) {
      var rows = groups[office];
      html += '<div class="office-group">';
      html += '<div class="office-header">';
      html += '<span class="office-name">' + escapeHtml(office) + '</span>';
      html += '<span class="office-total">총 ' + rows.length + '명</span>';
      html += '</div>';

      html += '<div class="table-scroll"><table><thead><tr>';
      html += '<th>구분</th><th>성명</th><th>재직</th><th>연락처</th><th>입사일</th><th>퇴사일</th><th>잔여 월차</th><th>잔여 연차</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(function(r) {
        var bal = balanceOf(r);
        html += '<tr>';
        html += '<td>' + escapeHtml(r[COL_INFO.role] || '') + '</td>';
        html += '<td><b>' + escapeHtml(r[COL_INFO.name] || '') + '</b></td>';
        html += '<td>' + (isResigned(r) ? '<span style="color:#8a5a2b; font-weight:700;">퇴사</span>' : '재직') + '</td>';
        html += '<td>' + escapeHtml(r[COL_INFO.phone] || '') + '</td>';
        html += '<td>' + escapeHtml(r[COL_INFO.hireDate] || '') + '</td>';
        html += '<td>' + escapeHtml(r[COL_INFO.resignDate] || '') + '</td>';
        html += '<td><span class="monthly-badge">' + escapeHtml(bal.monthly) + '일</span></td>';
        html += '<td><span class="annual-badge">' + escapeHtml(bal.annual) + '일</span></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  function loadAll() {
    setStatus('불러오는 중입니다...');
    fetchSheet(GID_INFO, function(rows) {
      var header = findHeaderRow_(rows);
      if (!header) {
        setStatus('오류: 시트에서 헤더(항목명) 행을 찾지 못했습니다. 시트 구조를 확인해주세요.');
        return;
      }
      COL_INFO = header.colMap;
      INFO_DATA_START_ROW = header.dataStartRow;
      allRows = rows.slice(INFO_DATA_START_ROW).filter(function(r) {
        var name = r[COL_INFO.name] && r[COL_INFO.name].trim().length > 0;
        return name; // 재직자·퇴사자 모두 읽고, 화면에서 [재직 구분]으로 나눕니다.
      });
      // 퇴사자 잔여 계산용 휴가 사용 내역 (실패해도 재직자 조회는 그대로 동작)
      fetchSheet(GID_HISTORY, function(hrows) {
        histRows = hrows.slice(1);
        finish();
      }, function() { histRows = []; finish(); }, 0);
      function finish() {
        setStatus('');
        populateOfficeFilter();
        populateRoleFilter();
        render();
        document.getElementById('updated').textContent = '조회 시각: ' + new Date().toLocaleString('ko-KR');
      }
    }, function(err) {
      setStatus('오류: ' + err.message);
    });
  }

  function downloadExcel() {
    var rows = getFilteredRows();
    if (rows.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['지점', '구분', '성명', '재직구분', '연락처', '입사일', '퇴사일', '잔여 월차', '잔여 연차']];
    rows.forEach(function(r) {
      var bal = balanceOf(r);
      aoa.push([
        r[COL_INFO.branch] || '',
        r[COL_INFO.role] || '',
        r[COL_INFO.name] || '',
        isResigned(r) ? '퇴사' : '재직',
        r[COL_INFO.phone] || '',
        r[COL_INFO.hireDate] || '',
        r[COL_INFO.resignDate] || '',
        bal.monthly,
        bal.annual
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '잔여휴가');
    var stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, '잔여휴가_모아보기_' + stamp + '.xlsx');
  }

  document.getElementById('searchInput').addEventListener('input', render);

  loadAll();
</script>
</body>
</html>
