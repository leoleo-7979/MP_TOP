<style>
  :root {

<div class="wrap">

  <h1>휴가 통합 조회</h1>
  <p class="sub">이름 또는 전화번호를 입력하면 잔여일수와 사용 내역을 함께 보여줍니다.</p>

  <div class="panel">
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <label style="flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-weight:700; background:#fff;"><input type="radio" name="mode" value="active" checked onchange="onModeChange()"> 재직자</label>

    </div>
    <input type="text" id="nameInput" placeholder="이름 또는 전화번호 입력 (예: 홍길동 / 010-1234-5678)" autocomplete="off">

<!-- 반려된 신청이 있을 때 뜨는 알림 팝업 (전화번호로 조회했을 때만) -->

<script>
  var SHEET_ID = '1X3LpMT3fl7AoIPPPNwces5UK4-uWxEkuDBkRX6BWvAE';
  var GID_INFO = '578655642';   // 사원정보 탭: 잔여 월차/연차 수
  var GID_HISTORY = '628017033'; // 휴가사용내역 탭 (전체 이력)

  // 헤더 이름으로 컬럼 위치를 자동으로 찾습니다. 시트에 컬럼이 추가/삭제/이동되어도
  // 이 코드를 매번 고치지 않도록, 고정된 열 번호 대신 시트의 실제 헤더(항목명)
  // 텍스트를 기준으로 위치를 찾습니다. 헤더 행 자체도 고정된 행 번호가 아니라,
  // 아래 HEADER_LABELS 항목들이 가장 많이 일치하는 행을 헤더 행으로 자동 인식합니다.
  // (참고: 이 시트는 1행이 별도 용도이고, 실제 항목명은 2행에 있습니다.)
  var HEADER_LABELS = {
    memberId: '회원번호', branch: '지점', role: '업무구분', name: '직원명',
    hireDate: '입사일', resignDate: '퇴사일', employmentStatus: '재직상태',
    phone: '연락처', monthly: '잔여 월차 수', annual: '잔여 연차 수'
  };
  var COL_INFO = null;         // findHeaderRow_()가 채웁니다.
  var INFO_DATA_START_ROW = 0; // findHeaderRow_()가 채웁니다.

  // rows 안에서 헤더 행을 찾아 { colMap: {필드명: 열 번호}, dataStartRow: 숫자 }를
  // 반환합니다. HEADER_LABELS 중 절반 이상이 일치하는 첫 번째 행을 헤더 행으로
  // 인정합니다. 못 찾으면 null을 반환합니다.
  function findHeaderRow_(rows) {
    var keys = Object.keys(HEADER_LABELS);
    var needed = Math.ceil(keys.length / 2);
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var map = {};
      var found = 0;
      keys.forEach(function(key) {
        var idx = row.indexOf(HEADER_LABELS[key]);
        if (idx !== -1) { map[key] = idx; found++; }
      });
      if (found >= needed) return { colMap: map, dataStartRow: r + 1 };
    }
    return null;
  }

  // Google Form prefill config for "휴가 신청하기" — pre-fills 지점/업무구분/성명/회원번호
  // so the manager never has to type (or guess) the internal employee name.
  var FORM_BASE_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSelgN-Hr-a0-LPi3PEBwF9SDbO0Nu0OMA6V8a3NswYmmIJ9cw/viewform';
  var FORM_ENTRY = {
    branch: 'entry.1230278992',
    role: 'entry.1061129149',
    name: 'entry.80286927',
    memberId: 'entry.1885821175'
  };

  function buildFormUrl(name, branch, role, memberId) {
    var params = [];
    params.push('usp=pp_url');
    if (branch) params.push(FORM_ENTRY.branch + '=' + encodeURIComponent(branch));
    if (role) params.push(FORM_ENTRY.role + '=' + encodeURIComponent(role));
    if (name) params.push(FORM_ENTRY.name + '=' + encodeURIComponent(name));
    if (memberId) params.push(FORM_ENTRY.memberId + '=' + encodeURIComponent(memberId));
    return FORM_BASE_URL + '?' + params.join('&');
  }

  var COL_HIST = {
    branch: 1, role: 2, name: 3, memberId: 4,
    startDate: 5, endDate: 6, days: 7, type: 8, note: 9
  };
  var HIST_DATA_START_ROW = 1;

  var infoRows = null;
  var histRows = null;

  document.getElementById('nameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') doSearch();
  });

  function setStatus(msg) {
    document.getElementById('status').textContent = msg || '';
  }

  // headersCount: 이 시트 범위 맨 위 몇 행이 "헤더"인지 (기본 0). 사원정보 탭(GID_INFO)은
  // 1행이 병합/구분용이고 실제 항목명이 2행에 있어서 headers=2로 요청해야, 데이터가
  // 숫자/날짜인 컬럼("잔여 월차 수"/"잔여 연차 수"/"입사일"/"퇴사일")의 헤더 텍스트가
  // 구글 gviz의 타입 변환 버그로 빈 값이 되어버리는 문제를 피할 수 있습니다. 휴가사용내역
  // 탭(GID_HISTORY)은 고정된 열 번호를 그대로 쓰고 있어서(원래 동작 그대로) headers=0을 씁니다.
  // 시트에 누군가 일반 "필터"를 걸어도 항상 전체 데이터를 보도록, 구글 gviz 대신
  // Apps Script 백엔드(action=getSheetData)를 거쳐 읽습니다. (Code.gs의 ALLOWED_READ_SHEETS에 등록된 탭만 허용)
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';
  function fetchSheet(gid, onDone, onError, headersCount) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      clearTimeout(timer);
      if (!data || !data.ok) throw new Error((data && data.error) || '시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err) {
      clearTimeout(timer);
      onError(err && err.name === 'AbortError' ? new Error('응답 시간이 초과되었습니다.') : (err instanceof Error ? err : new Error(String(err))));
    });
  }

  function loadAll(callback, onError) {
    setStatus('시트에서 데이터를 불러오는 중입니다...');
    document.getElementById('searchBtn').disabled = true;

    var pending = 2;
    var failed = false;

    function checkDone() {
      pending--;
      if (pending === 0 && !failed) {
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('updated').textContent = '마지막 조회: ' + new Date().toLocaleString('ko-KR');
        callback();
      }
    }
    function fail(err) {
      if (failed) return;
      failed = true;
      document.getElementById('searchBtn').disabled = false;
      onError(err);
    }

    fetchSheet(GID_INFO, function(rows) {
      var header = findHeaderRow_(rows);
      if (!header) {
        fail(new Error('시트에서 헤더(항목명) 행을 찾지 못했습니다.'));
        return;
      }
      COL_INFO = header.colMap;
      INFO_DATA_START_ROW = header.dataStartRow;
      infoRows = rows.slice(INFO_DATA_START_ROW).filter(function(row) {
        return row[COL_INFO.name] && row[COL_INFO.name].trim().length > 0;
      });
      checkDone();
    }, fail, 2);

    fetchSheet(GID_HISTORY, function(rows) {
      histRows = rows.slice(HIST_DATA_START_ROW).filter(function(row) {
        return row[COL_HIST.name] && row[COL_HIST.name].trim().length > 0 && row[COL_HIST.startDate] && row[COL_HIST.startDate].trim().length > 0;
      });
      checkDone();
    }, fail, 0);
  }

  function doSearch() {
    var query = document.getElementById('nameInput').value.trim();
    document.getElementById('results').innerHTML = '';
    if (!query) { setStatus('이름 또는 전화번호를 입력해주세요.'); return; }

    if (infoRows && histRows) {
      setStatus('');
      renderResults(query);
    } else {
      loadAll(
        function(){ setStatus(''); renderResults(query); },
        function(err){ setStatus('오류: ' + err.message); }
      );
    }
  }

  function findMatches(rows, nameIdx, query) {
    var exact = [];
    for (var i = 0; i < rows.length; i++) {
      var name = (rows[i][nameIdx] || '').trim();
      if (name === query) exact.push(rows[i]);
    }
    if (exact.length > 0) return exact;
    var partial = [];
    for (var j = 0; j < rows.length; j++) {
      var name2 = (rows[j][nameIdx] || '').trim();
      if (name2.indexOf(query) !== -1) partial.push(rows[j]);
    }
    return partial;
  }

  function normalizeDigits(s) {
    return String(s || '').replace(/[^0-9]/g, '');
  }

  function isPhoneLikeQuery(q) {
    var digits = normalizeDigits(q);
    return digits.length >= 4 && digits.length === q.replace(/[\s\-]/g, '').length;
  }

  function findByPhone(rows, query) {
    var digits = normalizeDigits(query);
    var matches = [];
    for (var i = 0; i < rows.length; i++) {
      var phone = normalizeDigits(rows[i][COL_INFO.phone]);
      if (!phone) continue;
      if (phone === digits || phone.indexOf(digits) !== -1) matches.push(rows[i]);
    }
    return matches;
  }

  function parseDateForSort(s) {
    var t = Date.parse(s);
    return isNaN(t) ? 0 : t;
  }

  function tagClass(type) {
    var t = (type || '').trim();
    if (t.indexOf('월차') !== -1) return 'tag-month';
    if (t.indexOf('연차') !== -1) return 'tag-annual';
    return 'tag-etc';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }


  // 퇴사 판정 (대시보드와 같은 기준): 퇴사일이 오늘 이전/당일이면 퇴사, 오늘 이후이면 "퇴사예정"으로 아직 재직중.
  // 퇴사일이 비어 있어도 재직상태가 "퇴사"(예정 아님)이면 퇴사로 봅니다.
  function isResignedRow(r) {
    var d = parseYMD(r[COL_INFO.resignDate]);
    if (d) { var t = new Date(); t.setHours(0,0,0,0); return d <= t; }
    var st = (COL_INFO.employmentStatus !== undefined ? (r[COL_INFO.employmentStatus] || '') : '');
    return st.indexOf('퇴사') !== -1 && st.indexOf('예정') === -1;
  }
  function getMode() {
    var r = document.querySelector('input[name="mode"]:checked');
    return r ? r.value : 'active';
  }
  function onModeChange() {
    document.getElementById('results').innerHTML = '';
    var q = document.getElementById('nameInput').value.trim();
    if (q && infoRows && histRows) renderResults(q);
  }
  function parseYMD(s) {
    var m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    return m ? new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10)) : null;
  }
  // 입사일 기준 매월 같은 날이 퇴사일(당일 포함)까지 몇 번 지났는지 (최대 11)
  function monthlyEarnedUntil(hire, end) {
    if (!hire || !end || end < hire) return 0;
    var n = 0;
    for (var k = 1; k <= 11; k++) {
      var d = new Date(hire.getFullYear(), hire.getMonth() + k, hire.getDate());
      if (d.getDate() !== hire.getDate()) d = new Date(hire.getFullYear(), hire.getMonth() + k + 1, 0);
      if (d <= end) n++; else break;
    }
    return n;
  }
  // 이름 또는 전화번호로 검색: 숫자만(4자리 이상) 입력하면 전화번호, 그 외에는 이름
  function findInfoRows(query) {
    if (isPhoneLikeQuery(query)) return { kind: 'phone', rows: findByPhone(infoRows, query) };
    var q = query.replace(/\s+/g, '');
    var exact = [], partial = [];
    infoRows.forEach(function(r) {
      var n = String(r[COL_INFO.name] || '').replace(/\s+/g, '');
      if (!n) return;
      if (n === q) exact.push(r); else if (n.indexOf(q) !== -1) partial.push(r);
    });
    return { kind: 'name', rows: exact.length ? exact : partial };
  }

  function renderResults(query) {
    var container = document.getElementById('results');
    var mode = getMode();

    var found = findInfoRows(query);
    var phoneMatches = found.rows;

    // 재직자: 퇴사일이 비어 있는 기록만 (재입사자는 이전 기록이 퇴사 처리되어 있으므로 구분됨)
    // 퇴사자: 퇴사일이 있는 기록만
    var activeMatches = phoneMatches.filter(function(r) {
      var resigned = isResignedRow(r);
      return mode === 'resigned' ? resigned : !resigned;
    });
    var what = found.kind === 'phone' ? '전화번호' : '이름';
    var withJosa = found.kind === 'phone' ? '전화번호로' : '이름으로';

    if (activeMatches.length === 0) {
      if (phoneMatches.length > 0) {
        container.innerHTML = mode === 'resigned'
          ? '<div class="empty">해당 ' + what + '의 퇴사 기록이 없습니다. (재직 중인 기록만 있습니다)</div>'
          : '<div class="empty">해당 ' + withJosa + ' 재직 중인 기록을 찾을 수 없습니다. [퇴사자]를 선택해 조회해보세요.</div>';
      } else {
        container.innerHTML = '<div class="empty">해당 ' + what + '을(를) 찾을 수 없습니다. 다시 확인해주세요.</div>';
      }
      return;
    }

    lastBlocks = [];
    var html = '';
    activeMatches.forEach(function(info) {
      var memberId = (info[COL_INFO.memberId] || '').trim();
      var name = info[COL_INFO.name].trim();
      var branch = info[COL_INFO.branch];

      // Bridge to history via 회원번호 (member ID) when available.
      var hist;
      if (memberId) {
        hist = histRows.filter(function(r){ return (r[COL_HIST.memberId] || '').trim() === memberId; });
      } else {
        hist = histRows.filter(function(r){ return r[COL_HIST.name].trim() === name; });
      }

      // Only show usage on/after the (latest) hire date on file — keeps pre-rehire
      // history out of view for employees whose 입사일 was updated on re-hire.
      var hireDateStr = info[COL_INFO.hireDate];
      var hireDateMs = hireDateStr ? Date.parse(hireDateStr) : NaN;
      if (!isNaN(hireDateMs)) {
        hist = hist.filter(function(r) {
          var d = Date.parse(r[COL_HIST.startDate]);
          return isNaN(d) ? true : d >= hireDateMs;
        });
      }

      if (mode === 'resigned') {
        var rdate = parseYMD(info[COL_INFO.resignDate]);
        if (rdate) hist = hist.filter(function(r){ var d = parseYMD(r[COL_HIST.startDate]); return !d || d <= rdate; });
      }
      html += renderEmployeeBlock(name, branch, memberId, info, hist, mode === 'resigned', found.kind === 'name');
    });

    html = '<button type="button" onclick="downloadResult()" style="background:#fff; color:var(--accent); border:1px solid var(--accent); margin-top:14px;">⬇ 엑셀 다운로드 (조회한 내용)</button>' + html;
    container.innerHTML = html;

    // 재직자 조회일 때만 "내 신청 현황"(대기/승인/반려)을 불러옵니다.
    if (mode !== 'resigned') {
      activeMatches.forEach(function(info) {
        var mid = (info[COL_INFO.memberId] || '').trim();
        if (mid) loadMyRequests(mid, found.kind === 'phone');
      });
    }
  }

  // ---------------------------------------------------------------
  // 내 신청 현황 + 반려 알림 팝업
  //  - 전화번호로 조회했을 때만 반려 사유를 보여주고 팝업을 띄웁니다.
  //    (이름으로 조회하면 남이 사유를 보거나 확인 처리해버릴 수 있어서 막아둠)
  //  - 팝업에서 [확인했습니다]를 누르면 시트의 "반려확인" 칸에 기록되어 다시 뜨지 않습니다.
  // ---------------------------------------------------------------
  function loadMyRequests(memberId, isPhone) {
    var el = document.getElementById('reqStatus-' + memberId);
    if (!el) return;
    var url = DASHBOARD_WEBAPP_URL + '?action=myRequests&memberId=' + encodeURIComponent(memberId);
    fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      if (!data || !data.ok) throw new Error((data && data.error) || '응답 오류');
      el.innerHTML = renderMyRequests(data.rows || [], isPhone);
      if (isPhone && data.rejectsToConfirm && data.rejectsToConfirm.length) {
        showRejectPopup(data.rejectsToConfirm);
      }
    }).catch(function(err) {
      el.innerHTML = '<div class="empty" style="margin-top:0;">신청 현황을 불러오지 못했습니다. (' + escapeHtml(err.message) + ')</div>';
    });
  }

  function renderMyRequests(rows, isPhone) {
    if (!rows.length) return '<div class="empty" style="margin-top:0;">최근 신청 내역이 없습니다.</div>';
    return rows.map(function(r) {
      var st = (r.status || '').trim();
      var cls = st === '승인' ? 'req-ok' : (st === '반려' ? 'req-no' : 'req-wait');
      var label = st || '승인 대기';
      var period = r.startDate === r.endDate || !r.endDate ? r.startDate : (r.startDate + ' ~ ' + r.endDate);
      var h = '<div class="req-item"><div class="req-top"><span>' + escapeHtml(period) + ' · ' + escapeHtml(r.type || '') + ' ' + escapeHtml(r.days || '') + '일</span>' +
        '<span class="req-badge ' + cls + '">' + escapeHtml(label) + '</span></div>';
      if (st === '반려') {
        h += '<div class="req-reason">' + (isPhone
          ? '반려 사유: ' + escapeHtml(r.reason || '(사유 없음)')
          : '반려 사유는 전화번호로 조회하면 확인할 수 있습니다.') + '</div>';
      }
      return h + '</div>';
    }).join('');
  }

  function showRejectPopup(items) {
    var q = window.__rejectQueue = window.__rejectQueue || [];
    items.forEach(function(it) {
      if (!q.some(function(x) { return x.sheetRow === it.sheetRow && x.memberId === it.memberId; })) q.push(it);
    });
    document.getElementById('rejectPopupList').innerHTML = q.map(function(it) {
      var period = it.startDate === it.endDate || !it.endDate ? it.startDate : (it.startDate + ' ~ ' + it.endDate);
      return '<div class="rj-item"><div class="rj-top">' + escapeHtml(period) + ' · ' + escapeHtml(it.type || '') + ' ' + escapeHtml(it.days || '') + '일</div>' +
        '<div class="rj-reason">' + escapeHtml(it.reason || '(사유 없음)') + '</div></div>';
    }).join('');
    document.getElementById('rejectAckBtn').disabled = false;
    document.getElementById('rejectPopup').classList.add('open');
  }

  function closeRejectPopup() {
    document.getElementById('rejectPopup').classList.remove('open');
    window.__rejectQueue = [];
  }

  function ackRejects() {
    var q = window.__rejectQueue || [];
    if (!q.length) { closeRejectPopup(); return; }
    var btn = document.getElementById('rejectAckBtn');
    btn.disabled = true;
    var jobs = q.map(function(it) {
      return fetch(DASHBOARD_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'ackReject', sheetRow: it.sheetRow, memberId: it.memberId })
      }).then(function(res) { return res.json(); });
    });
    Promise.all(jobs).then(function(results) {
      var failed = results.some(function(d) { return !(d && d.ok); });
      if (failed) {
        alert('일부 확인 처리에 실패했습니다. 잠시 후 다시 시도해주세요.');
        btn.disabled = false;
        return;
      }
      closeRejectPopup();
      var q2 = document.getElementById('nameInput').value.trim();
      if (q2) renderResults(q2); // 신청 현황 새로고침
    }).catch(function(err) {
      alert('확인 처리 중 오류가 발생했습니다: ' + err.message);
      btn.disabled = false;
    });
  }

  var lastBlocks = [];
  function downloadResult() {
    if (!lastBlocks.length) { alert('내려받을 조회 결과가 없습니다.'); return; }
    if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'); return; }
    var sum = [['이름','지점','업무구분','재직구분','연락처','입사일','퇴사일','잔여 월차','잔여 연차','비고']];
    var det = [['이름','지점','번호','시작일','종료일','일수','종류','비고']];
    lastBlocks.forEach(function(b) {
      sum.push([b.name, b.branch, b.role, b.resigned ? '퇴사' : (b.resignPlan ? '재직(퇴사예정)' : '재직'), b.phone, b.hireDate, b.resignDate, b.monthly, b.annual, b.note]);
      b.hist.forEach(function(row, i) {
        det.push([b.name, b.branch, i + 1, row[COL_HIST.startDate] || '', row[COL_HIST.endDate] || '', row[COL_HIST.days] || '', row[COL_HIST.type] || '', row[COL_HIST.note] || '']);
      });
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), '잔여휴가');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), '휴가사용내역');
    var who = lastBlocks.length === 1 ? lastBlocks[0].name : '조회결과';
    XLSX.writeFile(wb, '휴가조회_' + who + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }

  function renderEmployeeList(infoMatches, container, showAsButtons) {
    var html = '<div style="margin-top:10px;">';
    infoMatches.forEach(function(info) {
      var name = info[COL_INFO.name];
      var branch = info[COL_INFO.branch];
      var phone = info[COL_INFO.phone];
      html += '<div style="padding:10px; border:1px solid var(--line); border-radius:10px; margin-top:8px; font-size:13.5px;">';
      html += '<b>' + escapeHtml(name) + '</b> (' + escapeHtml(branch || '') + ') — ' + escapeHtml(phone || '전화번호 없음');
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML += html;
  }

  function renderEmployeeBlock(name, branch, memberId, info, hist, isResigned, showPhoneTail) {
    var html = '';
    html += '<div class="name-header"><span class="name">' + escapeHtml(name) + '</span>';
    if (branch) html += '<span class="branch">' + escapeHtml(branch) + '</span>';
    html += '</div>';
    if (showPhoneTail) {
      var tail = normalizeDigits(info[COL_INFO.phone]).slice(-4);
      if (tail) html += '<div class="meta">연락처 끝 4자리: ' + tail + ' (동명이인 구분용)</div>';
    }

    var role = info[COL_INFO.role] || '';
    if (isResigned) {
      html += '<div class="meta" style="color:var(--warn); font-weight:700;">퇴사자 · 퇴사일 ' + escapeHtml(info[COL_INFO.resignDate] || '') + '</div>';
    } else {
      var formUrl = buildFormUrl(name, branch, role, memberId);
      html += '<a href="' + formUrl + '" target="_blank" rel="noopener" style="display:block; text-decoration:none;">';
      html += '<button type="button" style="background:var(--warn); border-color:var(--warn);">휴가 신청하기</button>';
      html += '</a>';
      if (memberId) {
        html += '<div class="section-title">내 신청 현황</div>';
        html += '<div id="reqStatus-' + escapeHtml(memberId) + '"><div class="empty" style="margin-top:0;">불러오는 중...</div></div>';
      }
    }

    html += '<div class="section-title">잔여 휴가</div>';
    var hireDate = info[COL_INFO.hireDate] || '';
    var monthly = info[COL_INFO.monthly] || '0';
    var annual = info[COL_INFO.annual] || '0';
    var frozenNote = '';
    if (isResigned) {
      var hd = parseYMD(hireDate), rd2 = parseYMD(info[COL_INFO.resignDate]);
      var usedM = 0;
      hist.forEach(function(row){ if ((row[COL_HIST.type]||'').indexOf('월차') !== -1) usedM += parseFloat(row[COL_HIST.days]) || 0; });
      var earned = monthlyEarnedUntil(hd, rd2);
      monthly = String(Math.max(0, earned - usedM));
      var oneYear = hd ? new Date(hd.getFullYear() + 1, hd.getMonth(), hd.getDate()) : null;
      var under1 = !!(rd2 && oneYear && rd2 < oneYear);
      if (under1) annual = '0';
      frozenNote = '<div class="meta">퇴사일(' + escapeHtml(info[COL_INFO.resignDate] || '') + ') 기준 · 월차 발생 ' + earned + '개 − 사용 ' + usedM + '개' + (under1 ? '' : ' · 연차는 시트 값 기준') + '</div>';
    }
    html += '<div class="stat-grid">';
    html += '<div class="stat"><div class="label">잔여 월차</div><div class="value">' + escapeHtml(monthly) + '</div></div>';
    html += '<div class="stat"><div class="label">잔여 연차</div><div class="value">' + escapeHtml(annual) + '</div></div>';
    html += '</div>';
    if (hireDate) html += '<div class="meta">입사일: ' + escapeHtml(hireDate) + '</div>';
    html += frozenNote;

    html += '<div class="section-title">휴가 사용 내역</div>';
    if (hist.length > 0) {
      hist.sort(function(a, b) {
        return parseDateForSort(b[COL_HIST.startDate]) - parseDateForSort(a[COL_HIST.startDate]);
      });
      var totalMonthly = 0, totalAnnual = 0;
      hist.forEach(function(row) {
        var d = parseFloat(row[COL_HIST.days]) || 0;
        var t = (row[COL_HIST.type] || '').trim();
        if (t.indexOf('월차') !== -1) totalMonthly += d;
        else if (t.indexOf('연차') !== -1) totalAnnual += d;
      });

      html += '<div class="summary-row">';
      html += '<div class="summary"><div class="label">월차 사용</div><div class="value">' + totalMonthly + '</div></div>';
      html += '<div class="summary"><div class="label">연차 사용</div><div class="value">' + totalAnnual + '</div></div>';
      html += '</div>';

      html += '<div class="table-scroll"><table><thead><tr>';
      html += '<th>번호</th><th>시작일</th><th>종료일</th><th>일수</th><th>종류</th><th>비고</th>';
      html += '</tr></thead><tbody>';
      hist.forEach(function(row, i) {
        html += '<tr>';
        html += '<td>' + (i + 1) + '</td>';
        html += '<td>' + escapeHtml(row[COL_HIST.startDate] || '') + '</td>';
        html += '<td>' + escapeHtml(row[COL_HIST.endDate] || '') + '</td>';
        html += '<td>' + escapeHtml(row[COL_HIST.days] || '') + '</td>';
        html += '<td><span class="tag ' + tagClass(row[COL_HIST.type]) + '">' + escapeHtml(row[COL_HIST.type] || '') + '</span></td>';
        html += '<td class="note">' + escapeHtml(row[COL_HIST.note] || '') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<div class="empty" style="margin-top:0;">사용 내역이 없습니다.</div>';
    }

    var plan = parseYMD(info[COL_INFO.resignDate]);
    if (!isResigned && plan) html += '<div class="meta" style="color:var(--warn); font-weight:700;">퇴사예정 ' + escapeHtml(info[COL_INFO.resignDate] || '') + ' (현재 재직중)</div>';
    lastBlocks.push({
      name: name, branch: branch || '', role: role, phone: info[COL_INFO.phone] || '', hireDate: hireDate,
      resignDate: info[COL_INFO.resignDate] || '', resigned: !!isResigned, resignPlan: !isResigned && !!plan,
      monthly: monthly, annual: annual,
      note: frozenNote ? frozenNote.replace(/<[^>]+>/g, '') : '', hist: hist
    });
    html += '<hr class="divider">';
    return html;
  }
</script>
</body>
</html>
