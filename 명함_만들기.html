<title>명함 만들기</title>

<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    table { font-size: 13.5px; }
    thead th, tbody td { padding: 8px 10px; }
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 8px; text-align: center; }
  .privacy-note {
    font-size: 12.5px; color: var(--muted2); text-align: center; margin: 0 0 20px;
  }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08);
  }
  .controls { display: flex; gap: 8px; margin-bottom: 4px; }
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .month-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .month-row input[type=month] {
    font-size: 15px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: #fdf9fe; color: var(--ink); font-family: var(--sans);
  }
  .month-row input[type=month]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .month-clear-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .month-clear-btn:hover { background: var(--accent-soft); color: var(--accent); }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 10px 0; min-height: 18px; white-space: pre-line; }
  .count { font-size: 13.5px; color: var(--muted); margin: 10px 2px 6px; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14.5px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #faf3fb; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: 12.5px; font-weight: 700; background: #f0eaf7; color: var(--muted); white-space: nowrap; }
  .tag.voluntary { background: #fbe4ec; color: var(--warn); }
  .tag.expired { background: var(--accent-soft); color: var(--accent); }
  .tag.pending { background: #fff3d6; color: #b07a12; }
  .empty { color: var(--muted2); font-size: 15px; text-align: center; margin-top: 20px; }

  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 16px; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1040px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .privacy-note { font-size: 13px; }
    .panel { padding: 24px; }
    input[type=text] { font-size: 17px; padding: 13px 15px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .status { font-size: 15px; }
    .count { font-size: 15px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }
    .tag { font-size: 13.5px; padding: 4px 12px; }
    .empty { font-size: 16px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
  /* 지점·업무 다중선택: 켜진 버튼 앞에 체크 표시 ("전체" 제외) */
  .branch-btn.active:not([data-office=""])::before,
  .role-btn.active:not([data-role=""])::before { content: "\2713  "; }
  .kind-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .row-label { font-size: 13px; font-weight: 700; color: var(--accent); margin-right: 2px; }
  .kind-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .kind-btn.on-in { background: #2f9a5f; border-color: #2f9a5f; color: #fff; }
  .kind-btn.on-out { background: #e53935; border-color: #e53935; color: #fff; }
  .kind-hint { font-size: 12.5px; color: var(--muted); }
  .tag.t-in { background: #2f9a5f; color: #fff; }
  .tag.t-in-soon { background: #dff3e7; color: #2f9a5f; border: 1px solid #2f9a5f; }
  .tag.t-out { background: #e53935; color: #fff; }
  .tag.t-out-soon { background: #ff9800; color: #fff; }
  .multi-hint { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }

  .step-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 18px 0 8px; }
  .step-label:first-child { margin-top: 0; }
  .file-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn { font-family: var(--sans); font-size: 15px; font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  select { font-family: var(--sans); font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fdf9fe; color: var(--ink); width: 100%; margin-top: 8px; }
  .preview-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .preview-box canvas { display: block; width: 100%; height: auto; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .msg { font-size: 13.5px; color: var(--warn); margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>명함 만들기</h1>
  <p class="sub">신분증 사진 아래에 명함을 붙여 한 장의 파일로 내려받습니다.</p>
  <p class="privacy-note">🔒 신분증 사진은 이 기기의 브라우저 안에서만 처리되며 서버·시트로 전송하거나 저장하지 않습니다.</p>

  <div class="panel">
    <div class="step-label">1. 신분증 사진</div>
    <div class="file-row">
      <input type="file" id="photoInput" accept="image/*" style="display:none">
      <button type="button" class="btn ghost" onclick="document.getElementById('photoInput').click()">사진 파일 선택</button>
      <span id="photoName" class="kind-hint">선택된 파일 없음</span>
    </div>

    <div class="step-label">2. 근무 센터</div>
    <div class="multi-hint" style="margin-top:0">센터를 여러 개 눌러 함께 볼 수 있습니다. (다시 누르면 해제, 아무것도 안 고르면 전체 직원)</div>
    <div class="branch-row" id="branchRow" style="margin-top:8px"></div>
    <div id="addrPick" style="display:none"></div>

    <div class="step-label">3. 직원 선택</div>
    <div class="controls"><input type="text" id="searchInput" placeholder="이름 또는 연락처로 검색" autocomplete="off"></div>
    <select id="empSelect" size="1"></select>
    <div class="note" id="status">불러오는 중입니다...</div>

    <div class="step-label">미리보기</div>
    <div class="preview-box"><canvas id="cv" width="1200" height="800"></canvas></div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button type="button" class="btn" id="btnPng" onclick="downloadPng()" disabled>⬇ 이미지(PNG)로 다운로드</button>
      <button type="button" class="btn ghost" id="btnPdf" onclick="downloadPdf()" disabled>⬇ PDF로 다운로드</button>
    </div>
  </div>
</div>

  var emps = [];          // {name, phone, email, team, office, status, addr, fax}
  var centers = {};       // label -> {addr, fax}
  var selCenters = [], addrCenter = '';
  var selEmp = null;
  var photoImg = null, photoFile = '';
  var logoImg = new Image(); logoImg.src = LOGO_SRC;
  logoImg.onload = function(){ draw(); };

  function branchLabel(raw){ var s=(raw||'').trim(), i=s.indexOf('('); return i===-1?s:s.slice(0,i).trim(); }
  function norm(s){ return String(s||'').replace(/\s+/g,''); }
  function $(id){ return document.getElementById(id); }
  function setStatus(m){ $('status').textContent = m||''; }

  // ---- 시트 읽기 (다른 페이지와 같은 방식) ----
  var READ_KEY_STORE='mp_read_key', keyAsked_=false;
  function getReadKey_(){ try{return localStorage.getItem(READ_KEY_STORE)||'';}catch(e){return '';} }
  function setReadKey_(k){ try{ if(k) localStorage.setItem(READ_KEY_STORE,k); else localStorage.removeItem(READ_KEY_STORE);}catch(e){} }
  function askReadKey_(){ var k=window.prompt('접근 키를 입력해 주세요.'); k=k===null?'':String(k).trim(); setReadKey_(k); return k; }
  function fetchSheet(gid,onDone,onError,retried){
    var url=DASHBOARD_WEBAPP_URL+'?action=getSheetData&sheetId='+encodeURIComponent(SHEET_ID)+'&gid='+encodeURIComponent(gid)+'&key='+encodeURIComponent(getReadKey_());
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var timer=setTimeout(function(){ if(ctrl) ctrl.abort(); },30000);
    fetch(url, ctrl?{signal:ctrl.signal}:undefined).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status); return res.json();
    }).then(function(data){
      clearTimeout(timer);
      if(data && data.code==='AUTH'){
        if(!retried){ if(!keyAsked_){keyAsked_=true; askReadKey_();} if(getReadKey_()){ fetchSheet(gid,onDone,onError,true); return; } }
        else setReadKey_('');
        throw new Error('접근 키가 필요하거나 올바르지 않습니다. 새로고침 후 다시 입력해 주세요.');
      }
      if(!data||!data.ok) throw new Error((data&&data.error)||'시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err){
      clearTimeout(timer);
      onError(err&&err.name==='AbortError'?new Error('응답 시간이 초과되었습니다.'):(err instanceof Error?err:new Error(String(err))));
    });
  }

  function parseInfo(rows){
    var h=-1, idx={};
    for(var r=0;r<Math.min(rows.length,15);r++){
      var n=rows[r].map(norm);
      if(n.indexOf('성명')!==-1 && n.indexOf('연락처')!==-1){ h=r; break; }
    }
    if(h<0) throw new Error('사원정보 탭에서 헤더(성명/연락처)를 찾지 못했습니다.');
    var hn=rows[h].map(norm);
    ['지점','회사주소','팩스번호','성명','재직상태','연락처','e-mail','건수제연락처','팀명'].forEach(function(k){ idx[k]=hn.indexOf(k); });
    if(idx['성명']<0||idx['연락처']<0) throw new Error('필수 열(성명/연락처)이 없습니다.');
    function g(r,k){ var i=idx[k]; return i<0?'':String(r[i]==null?'':r[i]).trim(); }
    var out=[], cAgg={};
    for(var i=h+1;i<rows.length;i++){
      var r=rows[i]; var name=g(r,'성명'); if(!name) continue;
      var st=g(r,'재직상태');
      if(st.indexOf('퇴사')!==-1 && st.indexOf('예정')===-1) continue;
      var e={name:name, phone:g(r,'연락처')||g(r,'건수제연락처'), email:g(r,'e-mail'), team:g(r,'팀명')||DEFAULT_TEAM,
             office:branchLabel(g(r,'지점')), addr:g(r,'회사주소'), fax:g(r,'팩스번호')};
      out.push(e);
      if(e.office){
        var c=cAgg[e.office]||(cAgg[e.office]={a:{},f:{}});
        if(e.addr) c.a[e.addr]=(c.a[e.addr]||0)+1;
        if(e.fax) c.f[e.fax]=(c.f[e.fax]||0)+1;
      }
    }
    function top(o){ var b='',n=0; Object.keys(o).forEach(function(k){ if(o[k]>n){n=o[k];b=k;} }); return b; }
    var cs={}; Object.keys(cAgg).forEach(function(k){ cs[k]={addr:top(cAgg[k].a), fax:top(cAgg[k].f)}; });
    return {emps:out, centers:cs};
  }

  // ---- 화면 ----
  function renderCenters(){
    var row=$('branchRow'); row.innerHTML='';
    Object.keys(centers).sort(function(a,b){return a.localeCompare(b,'ko');}).forEach(function(c){
      var b=document.createElement('button'); b.type='button'; b.className='branch-btn'+(selCenters.indexOf(c)!==-1?' active':''); b.textContent=c;
      b.onclick=function(){ var i=selCenters.indexOf(c); if(i===-1) selCenters.push(c); else selCenters.splice(i,1); renderCenters(); renderEmps(); draw(); };
      row.appendChild(b);
    });
    renderAddrPick();
  }
  // 센터를 2개 이상 고른 경우에만, 명함에 넣을 주소·팩스의 센터를 따로 고릅니다.
  function effectiveCenter(){
    if(!selEmp) return '';
    if(selCenters.length===0) return selEmp.office;
    if(selCenters.length===1) return selCenters[0];
    if(selCenters.indexOf(addrCenter)!==-1) return addrCenter;
    return selCenters.indexOf(selEmp.office)!==-1 ? selEmp.office : selCenters[0];
  }
  function renderAddrPick(){
    var box=$('addrPick');
    if(selCenters.length<2){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block'; box.innerHTML='';
    var lab=document.createElement('div'); lab.className='multi-hint'; lab.textContent='명함에 넣을 주소·팩스는 어느 센터 기준인가요?'; box.appendChild(lab);
    var row=document.createElement('div'); row.className='branch-row'; row.style.marginTop='8px';
    var cur=effectiveCenter();
    selCenters.forEach(function(c){
      var b=document.createElement('button'); b.type='button'; b.className='branch-btn'+(c===cur?' active':''); b.textContent=c;
      b.onclick=function(){ addrCenter=c; renderAddrPick(); draw(); }; row.appendChild(b);
    });
    box.appendChild(row);
  }
  function renderEmps(){
    var q=$('searchInput').value.trim().toLowerCase(), qd=q.replace(/[^0-9]/g,'');
    var list=emps.filter(function(e){
      if(selCenters.length && selCenters.indexOf(e.office)===-1) return false;
      if(!q) return true;
      return e.name.toLowerCase().indexOf(q)!==-1 || (qd && e.phone.replace(/[^0-9]/g,'').indexOf(qd)!==-1);
    }).sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
    if(selEmp && list.indexOf(selEmp)===-1){ selEmp=null; }
    var sel=$('empSelect'); sel.innerHTML='';
    var ph=document.createElement('option'); ph.value=''; ph.textContent='직원을 선택하세요 ('+list.length+'명)'; sel.appendChild(ph);
    list.forEach(function(e,i){
      var o=document.createElement('option'); o.value=String(emps.indexOf(e));
      o.textContent=e.name+(e.office?' · '+e.office:'')+(e.phone?' · '+e.phone:''); sel.appendChild(o);
    });
    if(selEmp){ var k=String(emps.indexOf(selEmp)); for(var i=0;i<sel.options.length;i++) if(sel.options[i].value===k) sel.selectedIndex=i; }
  }

  // ---- 명함 그리기 ----
  var W=1200, FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  function wrap(ctx,text,maxW){
    var lines=[], cur='';
    text.split('').forEach(function(ch){ var t=cur+ch; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=ch; } else cur=t; });
    if(cur) lines.push(cur); return lines;
  }
  function cardData(){
    if(!selEmp) return null;
    var c=centers[effectiveCenter()]||centers[selEmp.office]||{};
    var addr=c.addr||selEmp.addr||'', fax=c.fax||selEmp.fax||'';
    return {name:selEmp.name, phone:selEmp.phone, email:selEmp.email, team:selEmp.team, addr:addr, fax:fax};
  }
  function drawCard(ctx, d, y0, doDraw){
    var pad=72, y;
    if(doDraw){ ctx.fillStyle='#fff'; }
    // 이름/직책
    if(doDraw){ ctx.fillStyle='#111'; ctx.font='800 46px '+FONT; ctx.textBaseline='alphabetic'; ctx.fillText(d.name, pad, y0+112);
      ctx.fillStyle='#222'; ctx.font='400 26px '+FONT; ctx.fillText(ROLE_TITLE, pad, y0+160);
      if(logoImg.complete && logoImg.naturalWidth){ var lw=270, lh=lw*logoImg.naturalHeight/logoImg.naturalWidth; ctx.drawImage(logoImg, W-pad-lw, y0+60, lw, lh); } }
    var top=y0+250, lh=44, lx=330, vx=lx+130;
    var rows=[['Mobile',d.phone],['Email',d.email],['Fax',d.fax]].filter(function(r){return r[1];});
    y=top+28;
    rows.forEach(function(r){ if(doDraw){ ctx.fillStyle='#1a1a1a'; ctx.font='700 27px '+FONT; ctx.fillText(r[0], lx, y); ctx.font='400 27px '+FONT; ctx.fillText(r[1], vx, y);} y+=lh; });
    if(d.addr){
      y+=6; if(doDraw){ ctx.fillStyle='#888'; ctx.font='400 25px '+FONT; ctx.fillText('Address.', lx, y);} y+=lh;
      var a=d.addr.replace(/\s*(\(주\)\s*마이크로프로텍트)\s*$/,'\n$1').split('\n');
      if(!doDraw) ctx.font='700 27px '+FONT;
      var maxW=W-pad-lx;
      a.forEach(function(seg){ ctx.font='700 27px '+FONT; wrap(ctx,seg,maxW).forEach(function(ln){ if(doDraw){ ctx.fillStyle='#111'; ctx.fillText(ln, lx, y);} y+=38; }); });
    }
    var end=y+30;
    if(doDraw){
      ctx.fillStyle='#2f5fa7'; ctx.font='600 26px '+FONT; ctx.fillText(d.team, pad, top+28);
      ctx.fillStyle='rgba(74,85,104,.65)'; ctx.fillRect(lx-34, top-6, 3, end-top-40);
    }
    return end;
  }
  function draw(){
    var cv=$('cv'), ctx=cv.getContext('2d');
    var d=cardData();
    var ph=800;
    if(photoImg){ ph=Math.round(W*photoImg.naturalHeight/photoImg.naturalWidth); }
    var ch=d?drawCard(ctx,d,0,false):380;
    cv.width=W; cv.height=ph+ch;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,cv.height);
    if(photoImg){ ctx.drawImage(photoImg,0,0,W,ph); }
    else { ctx.fillStyle='#eceaf0'; ctx.fillRect(0,0,W,ph); ctx.fillStyle='#8b7f99'; ctx.font='400 30px '+FONT; ctx.textAlign='center'; ctx.fillText('여기에 신분증 사진이 들어갑니다', W/2, ph/2); ctx.textAlign='left'; }
    if(d){ drawCard(ctx,d,ph,true); }
    else { ctx.fillStyle='#8b7f99'; ctx.font='400 28px '+FONT; ctx.textAlign='center'; ctx.fillText('직원을 선택하면 명함이 여기에 만들어집니다', W/2, ph+190); ctx.textAlign='left'; }
    var ok=!!(photoImg && d);
    $('btnPng').disabled=!ok; $('btnPdf').disabled=!ok;
    var m=[]; if(!photoImg) m.push('신분증 사진을 선택해 주세요.'); if(!d) m.push('직원을 선택해 주세요.');
    if(d && !d.addr) m.push('이 센터에 주소·팩스가 입력되어 있지 않습니다.');
    $('msg').textContent=m.join(' ');
  }

  // ---- 다운로드 ----
  function baseName(){ return (selEmp?selEmp.name:'명함')+'_신분증_명함'; }
  window.downloadPng=function(){
    $('cv').toBlob(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=baseName()+'.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000); },'image/png');
  };
  window.downloadPdf=function(){
    if(!window.jspdf){ alert('PDF 도구를 불러오지 못했습니다. PNG로 내려받아 주세요.'); return; }
    var cv=$('cv'), w=cv.width, h=cv.height;
    var pdf=new window.jspdf.jsPDF({orientation:w>h?'l':'p', unit:'px', format:[w,h], hotfixes:['px_scaling']});
    pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
    pdf.save(baseName()+'.pdf');
  };

  // ---- 이벤트 ----
  $('photoInput').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var img=new Image(); var url=URL.createObjectURL(f);
    img.onload=function(){ photoImg=img; photoFile=f.name; $('photoName').textContent=f.name+' 선택됨'; draw(); };
    img.onerror=function(){ $('msg').textContent='이미지를 열 수 없습니다. JPG/PNG 파일인지 확인해 주세요.'; };
    img.src=url;
  });
  $('searchInput').addEventListener('input',renderEmps);
  $('empSelect').addEventListener('change',function(){
    var v=$('empSelect').value; selEmp=v===''?null:emps[Number(v)];
    addrCenter=''; renderAddrPick(); draw();
  });

  draw();
  fetchSheet(GID_INFO,function(rows){
    try{ var p=parseInfo(rows); emps=p.emps; centers=p.centers; }
    catch(e){ setStatus('오류: '+e.message); return; }
    setStatus('재직 중인 직원 '+emps.length+'명 · 센터를 고르면 그 센터 직원만 목록에 나오고, 그 센터의 주소·팩스가 명함에 들어갑니다.');
    renderCenters(); renderEmps(); draw();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
  },function(err){ setStatus('오류: '+err.message); });
})();
</script>
</body>
</html>
