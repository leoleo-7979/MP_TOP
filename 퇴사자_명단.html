<style>

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */

    .status { font-size: 15px; }
    .count { font-size: 15px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }

    .empty { font-size: 16px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
  /* 지점·업무 다중선택: 켜진 버튼 앞에 체크 표시 ("전체" 제외) */

  .kind-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .row-label { font-size: 13px; font-weight: 700; color: var(--accent); margin-right: 2px; }
  .kind-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .kind-btn.on-in { background: #2f9a5f; border-color: #2f9a5f; color: #fff; }
  .kind-btn.on-out { background: #e53935; border-color: #e53935; color: #fff; }
  .kind-hint { font-size: 12.5px; color: var(--muted); }
  .tag.t-in { background: #2f9a5f; color: #fff; }
  .tag.t-in-soon { background: #dff3e7; color: #2f9a5f; border: 1px solid #2f9a5f; }
  .tag.t-out { background: #e53935; color: #fff; }
  .tag.t-out-soon { background: #ff9800; color: #fff; }
  .multi-hint { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }
</style>

    <div class="controls">

    </div>
    <div class="kind-row" id="kindRow">
      <span class="row-label">구분</span>
      <button type="button" class="kind-btn on-in" data-kind="in" onclick="toggleKind('in')">입사</button>
      <button type="button" class="kind-btn on-out" data-kind="out" onclick="toggleKind('out')">퇴사</button>
      <span class="kind-hint">(둘 다 켜면 입퇴사를 함께 보고, 하나도 안 켜면 전체가 보입니다)</span>

    </div>

    <div class="count" id="count"></div>

<script>
  var SHEET_ID = '1kQEUUWl9zFmd493YSopY2HxS4aAaGou_3Bar6G4fuqs';
  var GID_RESIGNED = '2087818190';
  var GID_ACTIVE = '1812898646'; // 현근무자 탭: 재직상태가 "퇴사예정"인 사람도 명단에 함께 보여주기 위해 읽습니다.

  // 승인 처리에 쓰는 것과 같은 Apps Script 웹앱 URL입니다. (배포 방법은 함께 전달된
  // "승인_기능_설정가이드.md" 문서를 참고하세요.)
  // 이 시트는 누군가 "필터"를 걸어두면 구글 gviz 조회 URL로는 필터링된 데이터만
  // 보이는 문제가 있어서, gviz 대신 이 백엔드를 거쳐 필터와 무관하게 항상 전체
  // 데이터를 가져옵니다.
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';

  // Column positions confirmed from the sheet (0-indexed, by column letter).
  // Intentionally NOT reading: I(주민등록번호), K(생년월일), L(주소), M(이메일),
  // N(은행), O(계좌번호), S(확인 내용) — these are sensitive personal data
  // and are excluded from this view on purpose.
  var COL = {
    office: 0,       // A
    role: 1,          // B 구분
    name: 3,          // D 성명
    phone: 4,         // E 연락처
    hireDate: 5,      // F 입사일
    resignDate: 6,    // G 퇴사일
    resignReason: 9,  // J 계약종료사유
    memo: 19          // T 메모
  };
  var DATA_START_ROW = 1;

  // 시트에 열이 추가/삭제/이동되어도 코드를 고치지 않도록, 헤더(항목명) 텍스트로 열 위치를
  // 자동으로 찾습니다. 항목명이 조금 다르게 적혀있을 가능성을 대비해 후보 이름을 여러 개 둡니다.
  // 헤더 행을 못 찾으면 위의 고정 열 번호(COL)를 그대로 사용합니다.
  var HEADER_ALIASES = {
    office: ['지점', '지점명'],
    role: ['구분', '업무구분'],
    name: ['성명', '직원명', '이름'],
    phone: ['연락처', '전화번호'],
    hireDate: ['입사일'],
    resignDate: ['퇴사일'],
    resignReason: ['계약종료사유', '퇴사사유']
  };

  // rows에서 헤더 행을 찾아 COL을 갱신하고 데이터 시작 행 번호를 반환합니다. (못 찾으면 null)
  function detectHeader_(rows) {
    var keys = Object.keys(HEADER_ALIASES);
    var needed = 4;
    for (var r = 0; r < Math.min(rows.length, 10); r++) {
      var cells = (rows[r] || []).map(function(c) { return String(c || '').replace(/\s+/g, ''); });
      var map = {}, found = 0;
      keys.forEach(function(k) {
        for (var a = 0; a < HEADER_ALIASES[k].length; a++) {
          var idx = cells.indexOf(HEADER_ALIASES[k][a]);
          if (idx !== -1) { map[k] = idx; found++; return; }
        }
      });
      if (found >= needed) {
        Object.keys(map).forEach(function(k) { COL[k] = map[k]; });
        return r + 1;
      }
    }
    return null;
  }

  // ---- 현근무자 탭에서 "퇴사예정"인 사람 읽기 ----
  // 현근무자 탭도 헤더(항목명) 텍스트로 열 위치를 찾습니다. (퇴사자 탭과 열 순서가 달라도 안전)
  var ACTIVE_ALIASES = {
    office: ['지점', '지점명'],
    role: ['업무구분', '구분'],
    name: ['성명', '직원명', '이름'],
    phone: ['연락처', '전화번호'],
    hireDate: ['입사일'],
    resignDate: ['퇴사일'],
    status: ['재직상태'],
    reason: ['계약종료사유', '퇴사사유']
  };

  // 현근무자 탭 rows에서 재직상태가 "퇴사"를 포함하는 행(=퇴사예정)만 골라, 퇴사자 탭과 같은
  // 열 구조(COL)의 행 배열로 바꿔 돌려줍니다. 각 행에는 _pending=true 표시가 붙습니다.
  function parseActiveEvents_(rows) {
    var keys = Object.keys(ACTIVE_ALIASES);
    var map = null, start = 0;
    for (var r = 0; r < Math.min(rows.length, 10); r++) {
      var cells = (rows[r] || []).map(function(c) { return String(c || '').replace(/\s+/g, ''); });
      var m = {}, found = 0;
      keys.forEach(function(k) {
        for (var a = 0; a < ACTIVE_ALIASES[k].length; a++) {
          var idx = cells.indexOf(ACTIVE_ALIASES[k][a]);
          if (idx !== -1) { m[k] = idx; found++; return; }
        }
      });
      // 재직상태와 성명 열은 반드시 있어야 하고, 전체 항목 중 4개 이상 일치해야 헤더 행으로 인정합니다.
      if (found >= 4 && m.status !== undefined && m.name !== undefined) { map = m; start = r + 1; break; }
    }
    if (!map) throw new Error('현근무자 탭에서 "재직상태" 헤더를 찾지 못했습니다.');

    function cell(row, k) { return map[k] === undefined ? '' : String(row[map[k]] == null ? '' : row[map[k]]).trim(); }

    var out = [];
    rows.slice(start).forEach(function(row) {
      var name = cell(row, 'name');
      if (!name) return;
      var status = cell(row, 'status');
      var o = [];
      o[COL.office] = cell(row, 'office');
      o[COL.role] = cell(row, 'role');
      o[COL.name] = name;
      o[COL.phone] = cell(row, 'phone');
      o[COL.hireDate] = cell(row, 'hireDate');
      o[COL.resignDate] = cell(row, 'resignDate');
      o[COL.resignReason] = cell(row, 'reason');
      if (status.indexOf('퇴사') !== -1) { var po = o.slice(); po._pending = true; po._kind = 'out'; out.push(po); }
      if (o[COL.hireDate]) { var io = o.slice(); io._kind = 'in'; out.push(io); } // 입사 기록 (퇴사예정자도 입사일은 있음)
    });
    return out;
  }

  // 같은 사람이 퇴사자 탭에도 이미 있으면 중복으로 넣지 않습니다.
  //  - 퇴사 기록: 이름+연락처, 또는 이름+입사일이 같으면 중복
  //  - 입사 기록: 이름+입사일이 같으면 중복 (퇴사자 탭에서 만든 입사 기록과 현근무자 탭 기록이 겹치는 경우)
  function mergePending_(resignedRows, activeEvents) {
    function digits(s) { return String(s || '').replace(/[^0-9]/g, ''); }
    function baseName(s) { return String(s || '').replace(/\(.*?\)/g, '').replace(/\s+/g, ''); }
    var outs = resignedRows.map(function(r) { var c = r.slice(); c._kind = 'out'; return c; });
    var ins = [];
    resignedRows.forEach(function(r) {
      if (String(r[COL.hireDate] || '').trim()) { var c = r.slice(); c._kind = 'in'; ins.push(c); }
    });
    var merged = outs.concat(ins);
    activeEvents.forEach(function(p) {
      var dup;
      if (p._kind === 'in') {
        dup = ins.some(function(r) { return baseName(r[COL.name]) === baseName(p[COL.name]) && String(r[COL.hireDate] || '').trim() === String(p[COL.hireDate] || '').trim(); });
        if (!dup) ins.push(p);
      } else {
        dup = outs.some(function(r) {
          if (baseName(r[COL.name]) !== baseName(p[COL.name])) return false;
          var rp = digits(r[COL.phone]), pp = digits(p[COL.phone]);
          if (rp && pp) return rp === pp;
          return String(r[COL.hireDate] || '').trim() === String(p[COL.hireDate] || '').trim();
        });
      }
      if (!dup) merged.push(p);
    });
    // 입사한 달에 바로 퇴사(또는 퇴사예정)한 사람은 같은 사람이 두 줄 나오지 않도록 퇴사 기록만 남깁니다.
    function ymOf(v) { var d = parseDate(v); return d ? d.getFullYear() + '-' + (d.getMonth() + 1) : ''; }
    var outKeys = {};
    merged.forEach(function(r) {
      if (r._kind === 'out') outKeys[baseName(r[COL.name]) + '|' + String(r[COL.hireDate] || '').trim() + '|' + ymOf(r[COL.resignDate])] = true;
    });
    return merged.filter(function(r) {
      if (r._kind !== 'in') return true;
      return !outKeys[baseName(r[COL.name]) + '|' + String(r[COL.hireDate] || '').trim() + '|' + ymOf(r[COL.hireDate])];
    });
  }

  var allRows = [];
  var selectedOffice = [];   // 선택된 지점들 (비어 있으면 전체)
  var selectedRole = [];     // 선택된 업무구분들 (비어 있으면 전체)
  var selectedMonth = ''; // 'YYYY-MM' 형식, 비어있으면 전체 기간 (처음에는 이번 달)
  var selectedKinds = ['in', 'out']; // 입사/퇴사 (비어 있으면 둘 다)

  // 여러 날짜 표기("2026-09-30", "2026. 9. 30" 등)를 모두 인식하기 위한 파서.
  function parseDate(dateStr) {
    if (!dateStr) return null;
    var m = String(dateStr).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    var t = Date.parse(dateStr);
    return isNaN(t) ? null : new Date(t);
  }

  // 한 행(입사 또는 퇴사 기록)의 기준 날짜와 구분 이름
  function evDate_(r) { return parseDate(r._kind === 'in' ? r[COL.hireDate] : r[COL.resignDate]); }
  function evLabel_(r) {
    if (r._kind === 'in') {
      var d = parseDate(r[COL.hireDate]), t = new Date(); t.setHours(0, 0, 0, 0);
      return d && d > t ? '입사예정' : '입사';
    }
    var rd = parseDate(r[COL.resignDate]), t2 = new Date(); t2.setHours(0, 0, 0, 0);
    return (r._pending || (rd && rd > t2)) ? '퇴사예정' : '퇴사'; // 퇴사일이 오늘 이후면 퇴사예정
  }
  var EV_CLASS = { '입사': 't-in', '입사예정': 't-in-soon', '퇴사': 't-out', '퇴사예정': 't-out-soon' };
  function toggleKind(k) {
    var i = selectedKinds.indexOf(k);
    if (i === -1) selectedKinds.push(k); else selectedKinds.splice(i, 1);
    document.querySelectorAll('.kind-btn').forEach(function(btn) {
      var kk = btn.getAttribute('data-kind');
      btn.className = 'kind-btn' + (selectedKinds.indexOf(kk) !== -1 ? ' on-' + kk : '');
    });
    render();
  }

  function clearMonth() {
    document.getElementById('monthInput').value = '';
    selectedMonth = '';
    render();
  }

  // 지점명에 괄호가 있으면("광주(전주)") 괄호 앞부분을 대표 지점명으로 사용합니다.
  // 지점 버튼은 이 대표 이름 기준으로 중복 없이 하나만 만들고, 그 버튼을 누르면
  // 괄호 안 표기를 포함한 모든 관련 행이 함께 보입니다. (표/엑셀에는 원본 텍스트 그대로 표시)
  function branchLabel(raw) {
    var s = (raw || '').trim();
    var idx = s.indexOf('(');
    return idx === -1 ? s : s.slice(0, idx).trim();
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 필터 상태와 무관하게 항상 전체 데이터를 가져오기 위해, 구글 gviz 조회 URL
  // 대신 Apps Script 백엔드(action=getSheetData)를 거쳐서 읽습니다.
  // ---- 접근 키 ----
  // 서버(Code.gs)에 스크립트 속성 READ_KEY 가 설정되어 있으면, 키가 맞는 요청에만 시트 데이터를 돌려줍니다.
  // 키는 이 브라우저(localStorage)에 저장되어 같은 주소의 다른 페이지와 공유되고, 서버가 키를 요구할 때만 입력창이 뜹니다.
  var READ_KEY_STORE = 'mp_read_key';
  var keyAsked_ = false;
  function getReadKey_() { try { return localStorage.getItem(READ_KEY_STORE) || ''; } catch (e) { return ''; } }
  function setReadKey_(k) { try { if (k) localStorage.setItem(READ_KEY_STORE, k); else localStorage.removeItem(READ_KEY_STORE); } catch (e) {} }
  function askReadKey_() {
    var k = window.prompt('접근 키를 입력해 주세요.');
    k = k === null ? '' : String(k).trim();
    setReadKey_(k);
    return k;
  }

  function fetchSheet(gid, onDone, onError, headersCount, retried) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid) +
      '&key=' + encodeURIComponent(getReadKey_());
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 30000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      clearTimeout(timer);
      if (data && data.code === 'AUTH') {
        if (!retried) {
          if (!keyAsked_) { keyAsked_ = true; askReadKey_(); } // 동시에 여러 번 요청돼도 입력창은 한 번만
          if (getReadKey_()) { fetchSheet(gid, onDone, onError, headersCount, true); return; }
        } else {
          setReadKey_(''); // 틀린 키는 지워서 다음에 다시 묻게 합니다
        }
        throw new Error('접근 키가 필요하거나 올바르지 않습니다. 새로고침 후 다시 입력해 주세요.');
      }
      if (!data || !data.ok) throw new Error((data && data.error) || '시트 응답 오류');
      onDone(data.rows);
    }).catch(function(err) {
      clearTimeout(timer);
      onError(err && err.name === 'AbortError' ? new Error('응답 시간이 초과되었습니다.') : (err instanceof Error ? err : new Error(String(err))));
    });
  }

  function reasonTag(reason) {
    var t = (reason || '').trim();
    if (t.indexOf('자진퇴사') !== -1) return 'tag voluntary';
    if (t.indexOf('계약만료') !== -1 || t.indexOf('계약종료') !== -1) return 'tag expired';
    return 'tag';
  }

  function populateOfficeFilter() {
    var offices = {};
    allRows.forEach(function(r) {
      var o = branchLabel(r[COL.office]);
      if (o) offices[o] = true;
    });
    var row = document.getElementById('branchRow');
    Object.keys(offices).sort(function(a, b) { return a.localeCompare(b, 'ko'); }).forEach(function(o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'branch-btn';
      btn.setAttribute('data-office', o);
      btn.textContent = o;
      btn.onclick = function() { selectOffice(o); };
      row.appendChild(btn);
    });
  }

  // 지점·업무 다중선택: 버튼을 누를 때마다 켜고 끄며, "전체"를 누르면 해당 줄 선택이 모두 해제됩니다.
  function toggleIn_(list, v) {
    var i = list.indexOf(v);
    if (i === -1) list.push(v); else list.splice(i, 1);
  }
  function syncFilterButtons_() {
    document.querySelectorAll('.branch-btn').forEach(function(btn) {
      var o = btn.getAttribute('data-office');
      btn.classList.toggle('active', o === '' ? selectedOffice.length === 0 : selectedOffice.indexOf(o) !== -1);
    });
    document.querySelectorAll('.role-btn').forEach(function(btn) {
      var r = btn.getAttribute('data-role');
      btn.classList.toggle('active', r === '' ? selectedRole.length === 0 : selectedRole.indexOf(r) !== -1);
    });
  }
  function selectOffice(office) {
    if (office === '') selectedOffice = []; else toggleIn_(selectedOffice, office);
    populateRoleFilter(); // 선택한 지점들에 없는 업무 선택은 이 안에서 자동으로 해제됩니다.
    syncFilterButtons_();
    render();
  }

  function populateRoleFilter() {
    var row = document.getElementById('roleRow');
    row.innerHTML = '<button type="button" class="role-btn active" data-role="" onclick="selectRole(\'\')">전체</button>';
    var roles = {};
    allRows.forEach(function(r) {
      if (selectedOffice.length && selectedOffice.indexOf(branchLabel(r[COL.office])) === -1) return;
      var role = (r[COL.role] || '').trim();
      if (role) roles[role] = true;
    });
    selectedRole = selectedRole.filter(function(x) { return roles[x]; });
    Object.keys(roles).sort().forEach(function(role) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-btn';
      btn.setAttribute('data-role', role);
      btn.textContent = role;
      btn.onclick = function() { selectRole(role); };
      row.appendChild(btn);
    });
  }

  function selectRole(role) {
    if (role === '') selectedRole = []; else toggleIn_(selectedRole, role);
    syncFilterButtons_();
    render();
  }

  function getFilteredRows() {
    var q = document.getElementById('searchInput').value.trim();
    var qDigits = q.replace(/[^0-9]/g, '');

    return allRows.filter(function(r) {
      if (selectedOffice.length && selectedOffice.indexOf(branchLabel(r[COL.office])) === -1) return false;
      if (selectedRole.length && selectedRole.indexOf((r[COL.role] || '').trim()) === -1) return false;
      if (selectedKinds.length && selectedKinds.indexOf(r._kind) === -1) return false;
      if (selectedMonth) {
        var d = evDate_(r);
        if (!d) return false;
        var ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (ym !== selectedMonth) return false;
      }
      if (!q) return true;
      var name = (r[COL.name] || '');
      var phone = (r[COL.phone] || '');
      var phoneMatch = qDigits.length > 0 && phone.replace(/[^0-9]/g, '').indexOf(qDigits) !== -1;
      return name.indexOf(q) !== -1 || phoneMatch;
    });
  }

  function evSort_(a, b) {
    var da = evDate_(a), db = evDate_(b);
    return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
  }

  function render() {
    var container = document.getElementById('results');

    var filtered = getFilteredRows();

    var cnt = {};
    filtered.forEach(function(r) { var l = evLabel_(r); cnt[l] = (cnt[l] || 0) + 1; });
    var parts = ['입사', '입사예정', '퇴사', '퇴사예정'].filter(function(l) { return cnt[l]; }).map(function(l) { return l + ' ' + cnt[l]; });
    document.getElementById('count').textContent = '총 ' + filtered.length + '명' + (selectedMonth ? ' (' + selectedMonth + ')' : '') + (parts.length ? ' · ' + parts.join(' · ') : '');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty">조건에 맞는 입퇴사 내역이 없습니다.</div>';
      return;
    }

    // 해당 날짜(입사일 또는 퇴사일) 최신순
    filtered.sort(evSort_);

    var html = '<div class="table-scroll"><table><thead><tr>';
    html += '<th>구분</th><th>지점</th><th>업무</th><th>성명</th><th>연락처</th><th>입사일</th><th>퇴사일</th><th>사유</th>';
    html += '</tr></thead><tbody>';
    filtered.forEach(function(r) {
      var ev = evLabel_(r);
      html += '<tr>';
      html += '<td><span class="tag ' + EV_CLASS[ev] + '">' + ev + '</span></td>';
      html += '<td>' + escapeHtml(r[COL.office] || '') + '</td>';
      html += '<td>' + escapeHtml(r[COL.role] || '') + '</td>';
      html += '<td><b>' + escapeHtml(r[COL.name] || '') + '</b></td>';
      html += '<td>' + escapeHtml(r[COL.phone] || '') + '</td>';
      html += '<td>' + escapeHtml(r[COL.hireDate] || '') + '</td>';
      html += '<td>' + escapeHtml(r._kind === 'in' ? '' : (r[COL.resignDate] || '')) + '</td>';
      var reason = r[COL.resignReason] || '';
      html += '<td>' + (r._kind === 'out' && reason ? '<span class="' + reasonTag(reason) + '">' + escapeHtml(reason) + '</span>' : '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    container.innerHTML = html;
  }

  function loadAll() {
    setStatus('불러오는 중입니다...');
    var resignedRows = null, pendingRows = null, activeErr = null, finished = false;

    function tryFinish() {
      if (finished || resignedRows === null || pendingRows === null) return;
      finished = true;
      allRows = mergePending_(resignedRows, pendingRows);
      // 현근무자 탭만 읽기 실패한 경우에도 퇴사자 탭 내용은 그대로 보여주고, 안내만 남깁니다.
      setStatus(activeErr ? '※ 현근무자 탭의 퇴사예정자를 불러오지 못했습니다. (' + activeErr.message + ')' : '');
      populateOfficeFilter();
      populateRoleFilter();
      render();
      document.getElementById('updated').textContent = '조회 시각: ' + new Date().toLocaleString('ko-KR');
    }

    // 1) 퇴사자 탭 (실패하면 전체 오류)
    fetchSheet(GID_RESIGNED, function(rows) {
      var start = detectHeader_(rows);
      resignedRows = rows.slice(start === null ? DATA_START_ROW : start).filter(function(r) {
        return r[COL.name] && r[COL.name].trim().length > 0;
      });
      tryFinish();
    }, function(err) {
      finished = true;
      setStatus('오류: ' + err.message);
    });

    // 2) 현근무자 탭의 퇴사예정자 (퇴사자 탭 열 위치가 확정된 뒤 COL을 쓰므로, 응답 처리는 resignedRows 이후에 합니다)
    fetchSheet(GID_ACTIVE, function(rows) {
      var waitResigned = function() {
        if (finished) return;
        if (resignedRows === null) { setTimeout(waitResigned, 50); return; }
        try { pendingRows = parseActiveEvents_(rows); }
        catch (e) { activeErr = e; pendingRows = []; }
        tryFinish();
      };
      waitResigned();
    }, function(err) {
      activeErr = err; pendingRows = [];
      tryFinish();
    });
  }

  // 개인정보 보호를 위해 화면에 보이는 항목(지점/구분/성명/연락처/입사일/퇴사일/사유)만
  // 내보냅니다. 주민등록번호·생년월일·주소·이메일·은행·계좌번호 등은 이 페이지에서
  // 애초에 읽어오지 않으므로(COL 정의 참고) 엑셀에도 포함되지 않습니다.
  function downloadExcel() {
    var rows = getFilteredRows().slice().sort(evSort_);
    if (rows.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['구분', '지점', '업무', '성명', '연락처', '입사일', '퇴사일', '사유']];
    rows.forEach(function(r) {
      aoa.push([
        evLabel_(r), r[COL.office] || '', r[COL.role] || '', r[COL.name] || '', r[COL.phone] || '',
        r[COL.hireDate] || '', r._kind === 'in' ? '' : (r[COL.resignDate] || ''), r._kind === 'out' ? (r[COL.resignReason] || '') : ''
      ]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '입퇴사명단');
    var stamp = selectedMonth || new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, '입퇴사_명단_' + stamp + '.xlsx');
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('monthInput').addEventListener('change', function() {
    selectedMonth = this.value || '';
    render();
  });

  // 처음에는 이번 달로 열립니다. ("월 조건 해제"를 누르면 전체 기간)
  (function initMonth_() {
    var d = new Date();
    var m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    document.getElementById('monthInput').value = m;
    selectedMonth = m;
  })();

  loadAll();
</script>
</body>
</html>
