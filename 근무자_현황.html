<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="msapplication-TileImage" content="mstile-150x150.png">
<meta name="msapplication-TileColor" content="#0a080e">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>근무자 현황</title>
<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    table { font-size: 13.5px; }
    thead th, tbody td { padding: 8px 10px; }
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 8px; text-align: center; }
  .privacy-note {
    font-size: 12.5px; color: var(--muted2); text-align: center; margin: 0 0 20px;
  }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08);
  }
  .controls { display: flex; gap: 8px; margin-bottom: 4px; }
  input[type=text] {
    flex: 1; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .month-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .month-row input[type=month] {
    font-size: 15px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: #fdf9fe; color: var(--ink); font-family: var(--sans);
  }
  .month-row input[type=month]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .month-clear-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .month-clear-btn:hover { background: var(--accent-soft); color: var(--accent); }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 12px 0 0; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 10px 0; min-height: 18px; white-space: pre-line; }
  .count { font-size: 13.5px; color: var(--muted); margin: 10px 2px 6px; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14.5px; }
  thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #faf3fb; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: 12.5px; font-weight: 700; background: #f0eaf7; color: var(--muted); white-space: nowrap; }
  .tag.voluntary { background: #fbe4ec; color: var(--warn); }
  .tag.expired { background: var(--accent-soft); color: var(--accent); }
  .tag.pending { background: #fff3d6; color: #b07a12; }
  .empty { color: var(--muted2); font-size: 15px; text-align: center; margin-top: 20px; }

  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 16px; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1040px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .privacy-note { font-size: 13px; }
    .panel { padding: 24px; }
    input[type=text] { font-size: 17px; padding: 13px 15px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .status { font-size: 15px; }
    .count { font-size: 15px; }
    table { font-size: 15.5px; }
    thead th, tbody td { padding: 12px 15px; }
    .tag { font-size: 13.5px; padding: 4px 12px; }
    .empty { font-size: 16px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
  /* 지점·업무 다중선택: 켜진 버튼 앞에 체크 표시 ("전체" 제외) */
  .branch-btn.active:not([data-office=""])::before,
  .role-btn.active:not([data-role=""])::before { content: "\2713  "; }
  .kind-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .row-label { font-size: 13px; font-weight: 700; color: var(--accent); margin-right: 2px; }
  .kind-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fdf9fe; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .kind-btn.on-in { background: #2f9a5f; border-color: #2f9a5f; color: #fff; }
  .kind-btn.on-out { background: #e53935; border-color: #e53935; color: #fff; }
  .kind-hint { font-size: 12.5px; color: var(--muted); }
  .tag.t-in { background: #2f9a5f; color: #fff; }
  .tag.t-in-soon { background: #dff3e7; color: #2f9a5f; border: 1px solid #2f9a5f; }
  .tag.t-out { background: #e53935; color: #fff; }
  .tag.t-out-soon { background: #ff9800; color: #fff; }
  .multi-hint { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }
  .wrap { max-width: 1040px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; margin: 0 0 14px; }
  .tab { font-family: var(--sans); font-size: 15.5px; font-weight: 800; padding: 13px 20px; border: none; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--accent); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .frame { width: 100%; border: 0; display: none; min-height: 480px; background: transparent; }
  .frame.on { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>근무자 현황</h1>
  <p class="sub">재직·계약만료·입퇴사 현황을 탭으로 바꿔가며 봅니다.</p>
  <div class="tabs" id="tabs"><button type="button" class="tab" id="t-summary">📊 요약</button><button type="button" class="tab" id="t-active">👥 재직 명단</button><button type="button" class="tab" id="t-contract">⏰ 계약만료</button><button type="button" class="tab" id="t-hires">🙋 입퇴사</button></div>
  <iframe class="frame" id="f-summary" title="📊 요약"></iframe>
  <iframe class="frame" id="f-active" title="👥 재직 명단"></iframe>
  <iframe class="frame" id="f-contract" title="⏰ 계약만료"></iframe>
  <iframe class="frame" id="f-hires" title="🙋 입퇴사"></iframe>
</div>
<script>
(function(){
  var TABS = [{"key": "summary", "label": "📊 요약", "src": "전체_현황_대시보드.html"}, {"key": "active", "label": "👥 재직 명단", "src": "재직중_근무자.html"}, {"key": "contract", "label": "⏰ 계약만료", "src": "계약만료_예정자.html"}, {"key": "hires", "label": "🙋 입퇴사", "src": "퇴사자_명단.html"}];
  var DEFAULT = "active";
  var loaded = {};
  function frameOf(k){ return document.getElementById('f-'+k); }
  function fit(fr){
    try {
      var d = fr.contentDocument; if(!d || !d.documentElement) return;
      var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if (h && Math.abs(fr.offsetHeight - h) > 2) fr.style.height = h + 'px';
    } catch(e) {}
  }
  setInterval(function(){ TABS.forEach(function(t){ var fr=frameOf(t.key); if(fr && fr.classList.contains('on')) fit(fr); }); }, 400);
  function show(key, push){
    if(!TABS.some(function(t){return t.key===key;})) key = DEFAULT;
    TABS.forEach(function(t){
      var on = t.key===key;
      document.getElementById('t-'+t.key).classList.toggle('on', on);
      var fr = frameOf(t.key); fr.classList.toggle('on', on);
      if(on && !loaded[t.key]){ loaded[t.key]=true; fr.src = t.src + '?embed=1'; }
    });
    var t0 = TABS.filter(function(t){return t.key===key;})[0];
    document.title = '근무자 현황 · ' + t0.label.replace(/^\S+\s/, '');
    if(push){ try { history.replaceState(null,'','#'+key); } catch(e){ location.hash = key; } }
  }
  TABS.forEach(function(t){ document.getElementById('t-'+t.key).onclick = function(){ show(t.key, true); }; });
  window.addEventListener('hashchange', function(){ show(location.hash.replace('#',''), false); });
  show(location.hash.replace('#','') || DEFAULT, false);
})();
</script>
</body>
</html>
