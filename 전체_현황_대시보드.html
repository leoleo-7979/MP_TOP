<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --ink: #4a3f5c;
    --paper: #fdf6fb;
    --line: #ecdcf0;
    --accent: #8e6fc4;
    --accent-soft: #f1e8fb;
    --warn: #d6748c;
    --muted: #8b7f99;
    --muted2: #c6b6da;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); padding: 40px 20px 80px;
    font-size: 16px;
  }
  @media (max-width: 480px) {
    body { padding: 22px 16px 64px; }
    .hero-row { flex-direction: column; gap: 10px; }
    .hero { padding: 17px; }
    .hero .value { font-size: 32px; }
    .hero .value.small { font-size: 26px; }
    .bar-label { flex-basis: 66px; font-size: 13px; }
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 24px; text-align: center; }

  .status { font-size: 14px; color: var(--warn); text-align: center; margin: 12px 0; min-height: 18px; }

  .branch-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .branch-btn {
    font-family: var(--sans); font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .branch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .role-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
  .role-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .role-btn.active { background: var(--warn); border-color: var(--warn); color: #fff; }

  .toolbar-row { display: flex; justify-content: flex-end; margin: 0 0 14px; }
  .excel-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 9px 16px; border-radius: 999px; border: none;
    background: #3fa66a; color: #fff; cursor: pointer;
  }
  .excel-btn:hover { background: #35915c; }

  .hero { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; text-align: center; box-shadow: 0 3px 12px rgba(142,111,196,0.08); }
  .hero-row { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .hero-row .hero { flex: 1; min-width: 160px; }
  .hero .value.small { font-size: 34px; }
  .hero .value { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1; }
  .hero .label { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .hero .note-small { font-size: 11.5px; color: #2f8f66; margin-top: 5px; font-weight: 700; }

  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 3px 12px rgba(142,111,196,0.08); margin-bottom: 18px;
  }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 14px; font-weight: 700; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { flex: 0 0 84px; font-size: 14px; font-weight: 600; }
  .bar-track { flex: 1; background: var(--paper); border-radius: 8px; height: 22px; overflow: hidden; display: flex; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 8px; }
  .bar-fill.alt { background: #f4b8a0; }
  .bar-value { flex: 0 0 48px; text-align: right; font-size: 14px; font-weight: 700; color: var(--accent); }

  .bar-seg { height: 100%; }

  .office-group { margin-bottom: 15px; }
  .office-group:last-child { margin-bottom: 0; }
  .office-header {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px;
  }
  .office-name { font-size: 15.5px; font-weight: 800; color: var(--ink); }
  .office-total { font-size: 13px; font-weight: 700; color: var(--accent); }
  .office-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-chip {
    font-size: 13px; font-weight: 700; color: var(--ink);
    border-radius: 12px; padding: 4px 11px;
  }

  .updated { text-align: center; font-size: 12.5px; color: var(--muted2); margin-top: 20px; }

  .month-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .month-controls input[type=month] {
    flex: 1; min-width: 140px; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fdf9fe; color: var(--ink);
  }
  .month-controls input[type=month]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .month-result {
    margin-top: 15px; text-align: center; padding: 20px;
    background: var(--accent-soft); border-radius: 14px;
  }
  .month-result .value { font-size: 38px; font-weight: 800; color: var(--accent); line-height: 1; }
  .month-result .label { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .month-note {
    font-size: 12.5px; color: var(--muted); margin-top: 10px; line-height: 1.6;
    padding-top: 10px; border-top: 1px solid var(--line);
  }
  .month-office-chip {
    font-size: 13px; font-weight: 700; color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px 11px;
    background: #fff; cursor: pointer;
  }
  .month-office-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .month-role-chip {
    font-size: 13px; font-weight: 700; color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px 11px;
    background: #fff; cursor: pointer;
  }
  .month-role-chip.active { background: var(--warn); border-color: var(--warn); color: #fff; }
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 14px;
    font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: #fbe4ec; color: var(--warn);
  }
  .status-badge.left { background: #e53935; color: #fff; }
  .status-badge.soon { background: #ff9800; color: #fff; }
  .status-ok { color: var(--ink); font-weight: 600; }
  .month-table-scroll { overflow-x: auto; margin-top: 15px; }
  .month-table-scroll table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .month-table-scroll thead th {
    background: var(--accent-soft); color: var(--accent); text-align: left;
    padding: 10px 12px; border-bottom: 2px solid var(--accent); font-weight: 700; white-space: nowrap;
  }
  .month-table-scroll tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .month-table-scroll tbody tr:nth-child(even) { background: #faf3fb; }

  .back-home {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; box-sizing: border-box;
    padding: 13px; margin: 0 0 20px;
    border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--accent);
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 3px 10px rgba(142,111,196,0.08);
  }
  .back-home:hover { background: var(--accent-soft); }

  /* ---- PC(데스크톱) 화면에서는 더 넓은 레이아웃으로 ---- */
  @media (min-width: 1024px) {
    .wrap { max-width: 1040px; }
    h1 { font-size: 32px; }
    .sub { font-size: 17px; }
    .status { font-size: 15px; }
    .hero { padding: 28px; }
    .hero .value { font-size: 54px; }
    .hero .value.small { font-size: 40px; }
    .hero .label { font-size: 15px; }
    .hero .note-small { font-size: 12.5px; }
    .panel { padding: 24px; }
    .panel h2 { font-size: 15px; }
    .bar-label { font-size: 15px; flex-basis: 96px; }
    .bar-track { height: 26px; }
    .bar-value { font-size: 15px; flex-basis: 56px; }
    .office-name { font-size: 17px; }
    .office-total { font-size: 14px; }
    .role-chip { font-size: 13.5px; padding: 4px 12px; }
    .month-controls input[type=month] { font-size: 17px; padding: 13px 15px; }
    .branch-btn { font-size: 14.5px; padding: 10px 18px; }
    .month-result { padding: 24px; }
    .month-result .value { font-size: 44px; }
    .month-result .label { font-size: 15px; }
    .month-note { font-size: 13.5px; }
    .month-office-chip { font-size: 13.5px; padding: 4px 12px; }
    .month-role-chip { font-size: 13.5px; padding: 4px 12px; }
    .month-table-scroll table { font-size: 15.5px; }
    .month-table-scroll thead th, .month-table-scroll tbody td { padding: 12px 15px; }
    .back-home { padding: 14px; border-radius: 14px; font-size: 15.5px; }
  }
  .mg-group { margin-top: 20px; }
  .mg-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px;
    padding: 11px 13px; background: var(--accent-soft); border-radius: 10px 10px 0 0; }
  .mg-name { font-size: 16px; font-weight: 800; color: var(--accent); }
  .mg-total { font-size: 13.5px; font-weight: 700; color: var(--accent); }
  .mg-roles { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
  .mg-role { font-size: 12.5px; font-weight: 600; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; }
  .mg-role b { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="index.html">‹ 매니저 관리 시스템으로 돌아가기</a>
  <h1>전체 현황 대시보드</h1>
  <p class="sub">재직 중인 매니저를 지점·업무구분별로 요약해서 보여줍니다.</p>

  <div class="status" id="status">불러오는 중입니다...</div>

  <div class="branch-row" id="branchRow">
    <button type="button" class="branch-btn active" data-office="" onclick="selectOffice('')">전체</button>
  </div>
  <div class="role-row" id="roleRow">
    <button type="button" class="role-btn active" data-role="" onclick="selectRole('')">전체</button>
  </div>
  <div class="toolbar-row">
    <button type="button" class="excel-btn" onclick="downloadExcel()">⬇ 엑셀 다운로드 (재직중 명단)</button>
  </div>

  <div id="hero-container"></div>
  <div id="office-container"></div>
  <div id="role-container"></div>

  <div class="panel">
    <h2>월별 재직자 수 조회</h2>
    <p class="sub" style="text-align:left; margin:0 0 14px; font-size:13px;">⭐ 표시는 계약만료일이 없는 무기계약·정직원입니다. (퇴사일은 퇴사자·퇴사예정자만 표시되며, 재직중인 분은 비어있습니다)<br>오늘 날짜 기준으로 이미 퇴사일이 지난 인원은 재직상태가 "퇴사"로 표시되고 현재/이후 달 조회에서는 자동으로 제외됩니다 (퇴사자 탭으로 아직 옮겨지지 않았어도 동일하게 적용됩니다).</p>
    <div class="month-controls">
      <input type="month" id="monthInput">
    </div>
    <div class="toolbar-row" style="margin-top:10px;">
      <button type="button" class="excel-btn" onclick="downloadMonthExcel()">⬇ 엑셀 다운로드 (월별 조회 결과)</button>
    </div>
    <div id="month-result"></div>
  </div>

  <div class="updated" id="updated"></div>
</div>

<script>
  var SHEET_ID = '1kQEUUWl9zFmd493YSopY2HxS4aAaGou_3Bar6G4fuqs';
  var GID_ACTIVE = '1812898646';
  var GID_RESIGNED = '2087818190';

  // 승인 처리에 쓰는 것과 같은 Apps Script 웹앱 URL입니다. (배포 방법은 함께 전달된
  // "승인_기능_설정가이드.md" 문서를 참고하세요.)
  // 이 시트는 누군가 "필터"를 걸어두면 구글 gviz 조회 URL로는 필터링된 데이터만
  // 보이는 문제가 있어서, gviz 대신 이 백엔드를 거쳐 필터와 무관하게 항상 전체
  // 데이터를 가져옵니다.
  var DASHBOARD_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxUBGesJFSJo_Eatdwao6riV2Vl12q8JbwFaCUtUYjKD-fYnkXhZpTn4SJtfTEt7cLxqA/exec';

  var COL = {
    office: 0,        // A
    role: 1,           // B 구분
    name: 3,            // D 성명
    hireDate: 5,         // F 입사일
    contractEnd: 15,      // P 계약기간 만료일
    contractTerm: 16,     // Q 정해진 계약기간 ("무기계약"/"정직원" 등이 여기에 적혀 있는 경우 대비)
    resignDate: 20,       // U 퇴사일 (아직 재직중이어도 퇴사 예정일이 미리 적혀 있는 경우가 있습니다)
    employmentStatus: 21  // V 재직상태 ("재직"/"퇴사예정"/"퇴사" 등)
  };
  var DATA_START_ROW = 1;

  // 시트에서 열이 추가/삭제되어도 깨지지 않도록, 헤더(항목명) 텍스트로 열 위치를 다시 찾습니다.
  // 헤더를 못 찾은 항목은 위의 고정 번호를 그대로 씁니다.
  function applyHeaderMap_(rows) {
    var limit = Math.min(rows.length, 5);
    for (var r = 0; r < limit; r++) {
      var h = rows[r].map(function(c) { return String(c || '').replace(/\s+/g, ''); });
      var iResign = h.indexOf('퇴사일'), iStatus = h.indexOf('재직상태');
      if (iResign === -1 || iStatus === -1) continue;
      COL.resignDate = iResign;
      COL.employmentStatus = iStatus;
      var iName = h.indexOf('성명'); if (iName !== -1) COL.name = iName;
      var iHire = h.indexOf('입사일'); if (iHire !== -1) COL.hireDate = iHire;
      for (var i = 0; i < h.length; i++) {
        if (h[i].indexOf('만료') !== -1 && h[i].indexOf('계약') !== -1) { COL.contractEnd = i; break; }
      }
      return;
    }
  }

  // 퇴사자_명단 탭 열 구성 — 퇴사자_명단.html과 동일한 매핑
  var COL_RESIGNED = {
    office: 0,       // A
    role: 1,          // B 구분
    name: 3,          // D 성명
    hireDate: 5,      // F 입사일
    resignDate: 6     // G 퇴사일
  };

  var combinedRoster = []; // {office, role, name, hireDate, resignDate(or null)}
  var activeRows = []; // 재직중(현재 활성) 원본 행 전체 (필터 적용 전)
  var selectedOffice = '';
  var selectedRole = '';
  var monthSelectedOffice = '';
  var monthSelectedRole = '';
  var lastMonthMatches = [];

  // Preferred display order for 구분 (role), matching 재직중_근무자.html
  var ROLE_ORDER = ['배당', '검수', '1차검수', '발급', '발급/건수', '발급(건수)', '발급/프리랜서', '발급(프리랜서)', '프리랜서'];
  function roleRank(role) {
    var i = ROLE_ORDER.indexOf(role);
    return i === -1 ? ROLE_ORDER.length : i;
  }

  var ROLE_COLOR_PALETTE = ['#e5d4f5', '#ffd6e7', '#d6e8fb', '#ffe3cc', '#d3f0e0', '#fff3c4', '#f7d3df', '#dcdcf7'];
  function assignRoleColors(roleList) {
    var map = {};
    roleList.forEach(function(role, i) {
      map[role] = ROLE_COLOR_PALETTE[i % ROLE_COLOR_PALETTE.length];
    });
    return map;
  }

  // 지점명에 괄호가 있으면("광주(전주)") 괄호 앞부분을 대표 지점명으로 사용합니다.
  // 지점 버튼은 이 대표 이름 기준으로 중복 없이 하나만 만들고, 그 버튼을 누르면
  // 괄호 안 표기를 포함한 모든 관련 행이 함께 보입니다. (표/엑셀에는 원본 텍스트 그대로 표시)
  function branchLabel(raw) {
    var s = (raw || '').trim();
    var idx = s.indexOf('(');
    return idx === -1 ? s : s.slice(0, idx).trim();
  }

  function populateTopFilters() {
    var offices = {};
    activeRows.forEach(function(r) {
      var o = branchLabel(r[COL.office]);
      if (o) offices[o] = true;
    });
    var row = document.getElementById('branchRow');
    row.innerHTML = '<button type="button" class="branch-btn active" data-office="" onclick="selectOffice(\'\')">전체</button>';
    Object.keys(offices).sort(function(a, b) { return a.localeCompare(b, 'ko'); }).forEach(function(o) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'branch-btn';
      btn.setAttribute('data-office', o);
      btn.textContent = o;
      btn.onclick = function() { selectOffice(o); };
      row.appendChild(btn);
    });
    populateTopRoleFilter();
  }

  function populateTopRoleFilter() {
    var row = document.getElementById('roleRow');
    row.innerHTML = '<button type="button" class="role-btn active" data-role="" onclick="selectRole(\'\')">전체</button>';
    var roles = {};
    activeRows.forEach(function(r) {
      if (selectedOffice && branchLabel(r[COL.office]) !== selectedOffice) return;
      var role = (r[COL.role] || '').trim();
      if (role) roles[role] = true;
    });
    Object.keys(roles).sort(function(a, b) {
      var d = roleRank(a) - roleRank(b);
      return d !== 0 ? d : a.localeCompare(b);
    }).forEach(function(role) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-btn';
      btn.setAttribute('data-role', role);
      btn.textContent = role;
      btn.onclick = function() { selectRole(role); };
      row.appendChild(btn);
    });
  }

  function selectOffice(office) {
    selectedOffice = office;
    document.querySelectorAll('#branchRow .branch-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-office') === office);
    });
    selectedRole = '';
    populateTopRoleFilter();
    render(getFilteredActiveRows());
  }

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('#roleRow .role-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-role') === role);
    });
    render(getFilteredActiveRows());
  }

  function getFilteredActiveRows() {
    return activeRows.filter(function(r) {
      if (selectedOffice && branchLabel(r[COL.office]) !== selectedOffice) return false;
      if (selectedRole && (r[COL.role] || '').trim() !== selectedRole) return false;
      return true;
    });
  }

  function downloadExcel() {
    var rows = getFilteredActiveRows();
    if (rows.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['지점', '구분', '성명', '입사일', '계약만료일/구분']];
    rows.forEach(function(r) {
      var endText = (r[COL.contractEnd] || '').trim() || (r[COL.contractTerm] || '').trim();
      aoa.push([r[COL.office] || '', r[COL.role] || '', r[COL.name] || '', r[COL.hireDate] || '', endText]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '전체현황');
    var stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, '전체_현황_대시보드_' + stamp + '.xlsx');
  }

  function downloadMonthExcel() {
    if (lastMonthMatches.length === 0) { alert('내려받을 데이터가 없습니다.'); return; }
    var aoa = [['지점', '구분', '성명', '입사일', '퇴사일', '재직상태']];
    lastMonthMatches.forEach(function(p) {
      aoa.push([p.office || '', p.role || '', (p.permanent ? '⭐ ' : '') + (p.name || ''), p.hireDate || '', p.resignDate || '', p.employmentStatus || '']);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '월별재직자');
    var month = document.getElementById('monthInput').value || new Date().toISOString().slice(0, 7);
    XLSX.writeFile(wb, '월별_재직자_' + month + '.xlsx');
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parseDate(dateStr) {
    if (!dateStr) return null;
    var m = String(dateStr).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
    var t = Date.parse(dateStr);
    return isNaN(t) ? null : new Date(t);
  }

  // 시트에 적힌 재직상태 텍스트를 그대로 믿지 않고, 퇴사일과 오늘 날짜를 비교해서
  // 실제 상태를 판단합니다. (담당자가 바빠서 퇴사자 탭으로 옮기지 못했거나 재직상태
  // 텍스트를 갱신하지 못한 경우에도 정확하게 반영되도록)
  //  - 퇴사일이 없음        → 재직 (label: '재직', excluded: false)
  //  - 퇴사일이 오늘보다 이후 → 퇴사예정 (excluded: false, 계속 포함)
  //  - 퇴사일이 오늘이거나 이전 → 퇴사 (excluded: true, 재직 목록에서 제외)
  function getEffectiveStatus(resignDateStr) {
    var resign = parseDate(resignDateStr);
    if (!resign) return { label: '재직', excluded: false };
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    if (resign <= today) return { label: '퇴사', excluded: true };
    return { label: '퇴사예정', excluded: false };
  }

  // 필터 상태와 무관하게 항상 전체 데이터를 가져오기 위해, 구글 gviz 조회 URL
  // 대신 Apps Script 백엔드(action=getSheetData)를 거쳐서 읽습니다.
  function fetchSheet(gid, onDone, onError) {
    var url = DASHBOARD_WEBAPP_URL + '?action=getSheetData' +
      '&sheetId=' + encodeURIComponent(SHEET_ID) + '&gid=' + encodeURIComponent(gid);

    fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      if (!data || !data.ok) {
        throw new Error((data && data.error) || '시트 응답 오류');
      }
      onDone(data.rows);
    }).catch(function(err) {
      onError(err instanceof Error ? err : new Error(String(err)));
    });
  }

  function renderBarGroup(containerId, title, counts, order, altClass) {
    var max = 0;
    order.forEach(function(k) { if (counts[k] > max) max = counts[k]; });

    var html = '<div class="panel"><h2>' + escapeHtml(title) + '</h2>';
    order.forEach(function(k) {
      var v = counts[k];
      var pct = max > 0 ? Math.round((v / max) * 100) : 0;
      html += '<div class="bar-row">';
      html += '<div class="bar-label">' + escapeHtml(k) + '</div>';
      html += '<div class="bar-track"><div class="bar-fill' + (altClass ? ' alt' : '') + '" style="width:' + pct + '%;"></div></div>';
      html += '<div class="bar-value">' + v + '명</div>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById(containerId).innerHTML = html;
  }

  // 지점별 인원: 막대 없이, 지점명+총원 배지 아래 업무구분별 색상 태그로만 표시.
  function renderOfficeChips(containerId, title, officeOrder, officeTotals, officeRoleCounts, roleOrder, roleColors) {
    var html = '<div class="panel"><h2>' + escapeHtml(title) + '</h2>';

    officeOrder.forEach(function(o) {
      html += '<div class="office-group">';
      html += '<div class="office-header">';
      html += '<span class="office-name">' + escapeHtml(o) + '</span>';
      html += '<span class="office-total">총 ' + officeTotals[o] + '명</span>';
      html += '</div>';
      html += '<div class="office-chips">';
      roleOrder.forEach(function(role) {
        var count = officeRoleCounts[o][role] || 0;
        if (count === 0) return;
        html += '<span class="role-chip" style="background:' + roleColors[role] + ';">' + escapeHtml(role) + ' ' + count + '</span>';
      });
      html += '</div>';
      html += '</div>';
    });

    html += '</div>';
    document.getElementById(containerId).innerHTML = html;
  }

  function render(rows) {
    var today = new Date();
    today.setHours(0,0,0,0);

    // 계약만료 임박자 수 (30일 이내, 이미 지난 계약 포함)
    // 계약만료일(P열)이 비어있거나 "무기계약"/"정직원"처럼 날짜가 아닌 값이 적힌 사람은
    // 계약 종료가 없는 것이므로 임박자 집계에서는 제외하되, 몇 명인지 별도로 세어
    // 화면에 안내해줍니다 (총원/지점별/업무구분별 집계에는 그대로 포함되어 계속 근무 인원으로 잡힙니다).
    var contractSoonCount = 0;
    var permanentStatusCount = 0;
    rows.forEach(function(r) {
      var raw = (r[COL.contractEnd] || '').trim();
      var end = parseDate(raw);
      if (!end) {
        permanentStatusCount++;
        return;
      }
      var dday = Math.round((end - today) / (1000*60*60*24));
      if (dday <= 30) contractSoonCount++;
    });

    // 평균 근속연수/개월수 (입사일 있는 사람 기준)
    var tenureDaysSum = 0, tenureCount = 0;
    rows.forEach(function(r) {
      var hire = parseDate(r[COL.hireDate]);
      if (!hire) return;
      var days = (today - hire) / (1000*60*60*24);
      if (days >= 0) { tenureDaysSum += days; tenureCount++; }
    });
    var avgMonths = tenureCount > 0 ? (tenureDaysSum / tenureCount) / 30.44 : 0;
    var avgYears = Math.floor(avgMonths / 12);
    var avgRemMonths = Math.round(avgMonths - avgYears * 12);
    if (avgRemMonths === 12) { avgYears += 1; avgRemMonths = 0; }
    var tenureLabel = tenureCount > 0 ? (avgYears + '년 ' + avgRemMonths + '개월') : '데이터 없음';

    document.getElementById('hero-container').innerHTML =
      '<div class="hero-row">' +
        '<div class="hero"><div class="value">' + rows.length + '명</div><div class="label">전체 재직중 매니저</div></div>' +
        '<div class="hero"><div class="value small">' + contractSoonCount + '명</div><div class="label">계약만료 임박자 (30일 이내)</div>' +
          (permanentStatusCount > 0 ? '<div class="note-small">🌿 무기계약·정직원 등 ' + permanentStatusCount + '명은 계속 근무 (제외)</div>' : '') +
        '</div>' +
        '<div class="hero"><div class="value small">' + tenureLabel + '</div><div class="label">평균 근속연수</div></div>' +
      '</div>';

    // 전체 업무구분 목록 (범례/색상용) — 지점별 인원 차트와 업무구분별 인원 차트가 같은 색을 쓰도록 먼저 계산.
    var roleCounts = {};
    var roleOrder = [];
    rows.forEach(function(r) {
      var role = (r[COL.role] || '').trim() || '미분류';
      if (!roleCounts[role]) { roleCounts[role] = 0; roleOrder.push(role); }
      roleCounts[role]++;
    });
    roleOrder.sort(function(a, b) {
      var d = roleRank(a) - roleRank(b);
      return d !== 0 ? d : roleCounts[b] - roleCounts[a];
    });
    var roleColors = assignRoleColors(roleOrder);

    // 지점별 인원 — 지점마다 업무구분 구성비를 색으로 나눈 누적 막대
    var officeTotals = {};
    var officeOrder = [];
    var officeRoleCounts = {};
    rows.forEach(function(r) {
      var o = (r[COL.office] || '').trim() || '지점 미상';
      var role = (r[COL.role] || '').trim() || '미분류';
      if (!officeTotals[o]) { officeTotals[o] = 0; officeOrder.push(o); officeRoleCounts[o] = {}; }
      officeTotals[o]++;
      officeRoleCounts[o][role] = (officeRoleCounts[o][role] || 0) + 1;
    });
    officeOrder.sort(function(a, b) { return officeTotals[b] - officeTotals[a]; });
    renderOfficeChips('office-container', '지점별 인원', officeOrder, officeTotals, officeRoleCounts, roleOrder, roleColors);

    renderBarGroup('role-container', '업무구분별 인원', roleCounts, roleOrder, true);
  }

  function loadAll() {
    setStatus('불러오는 중입니다...');

    var pending = 2, failed = false;
    var activeFiltered = null, resignedFiltered = null;

    function checkDone() {
      pending--;
      if (pending === 0 && !failed) {
        setStatus('');
        // 현재 재직중 목록/집계에는, 오늘 날짜 기준으로 이미 퇴사일이 지난 사람을
        // 제외합니다. 아직 시트의 재직상태 텍스트가 "재직"으로 남아있거나 퇴사자
        // 탭으로 옮겨지지 않았어도 동일하게 적용됩니다.
        activeRows = activeFiltered.filter(function(r) {
          return !getEffectiveStatus(r[COL.resignDate]).excluded;
        });
        populateTopFilters();
        render(getFilteredActiveRows());

        // combinedRoster(월별 조회용)는 과거 달 조회를 위해 이미 퇴사한 사람도
        // 포함한 전체 목록을 유지합니다. 대신 재직상태는 시트 텍스트가 아니라
        // 퇴사일 기준으로 다시 계산합니다.
        combinedRoster = activeFiltered.map(function(r) {
          // 계약만료일(P열)에 날짜가 없으면 무기계약/정직원으로 보고 permanent 표시를 해둡니다.
          var permanent = !parseDate((r[COL.contractEnd] || '').trim());
          return {
            office: r[COL.office], role: r[COL.role], name: r[COL.name], hireDate: r[COL.hireDate],
            resignDate: r[COL.resignDate] || null,
            employmentStatus: getEffectiveStatus(r[COL.resignDate]).label,
            permanent: permanent
          };
        }).concat(resignedFiltered.map(function(r) {
          return {
            office: r[COL_RESIGNED.office], role: r[COL_RESIGNED.role], name: r[COL_RESIGNED.name], hireDate: r[COL_RESIGNED.hireDate],
            resignDate: r[COL_RESIGNED.resignDate], employmentStatus: '퇴사', permanent: false
          };
        }));

        initMonthLookup();
        document.getElementById('updated').textContent = '조회 시각: ' + new Date().toLocaleString('ko-KR');
      }
    }
    function fail(err) {
      if (failed) return;
      failed = true;
      setStatus('오류: ' + err.message);
    }

    fetchSheet(GID_ACTIVE, function(rows) {
      applyHeaderMap_(rows);
      activeFiltered = rows.slice(DATA_START_ROW).filter(function(r) {
        return r[COL.name] && r[COL.name].trim().length > 0;
      });
      checkDone();
    }, fail);

    fetchSheet(GID_RESIGNED, function(rows) {
      resignedFiltered = rows.slice(DATA_START_ROW).filter(function(r) {
        return r[COL_RESIGNED.name] && r[COL_RESIGNED.name].trim().length > 0;
      });
      checkDone();
    }, fail);
  }

  function initMonthLookup() {
    var input = document.getElementById('monthInput');
    var d = new Date();
    input.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

    input.addEventListener('change', renderMonthLookup);
    renderMonthLookup();
  }

  function renderMonthLookup() {
    var month = document.getElementById('monthInput').value;
    var selectedOffice = monthSelectedOffice;
    var selRole = monthSelectedRole;
    var container = document.getElementById('month-result');
    if (!month) { container.innerHTML = ''; return; }

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var parts = month.split('-');
    var monthStart = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    var monthEnd = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10), 0); // last day of month

    var inMonth = combinedRoster.filter(function(p) {
      var hire = parseDate(p.hireDate);
      if (!hire || hire > monthEnd) return false; // not yet hired by end of month
      var resign = p.resignDate ? parseDate(p.resignDate) : null;
      if (resign && resign < monthStart) return false; // already left before this month started
      // 오늘 날짜 기준으로 이미 퇴사한 사람은, 현재 달이나 이후 달을 조회할 때는
      // 목록에서 제외합니다 (과거 달을 조회할 때는 그 당시 재직 기록이므로 그대로 보여줍니다).
      if (monthEnd >= today && p.employmentStatus === '퇴사') return false;
      return true;
    });

    var afterOffice = selectedOffice
      ? inMonth.filter(function(p) { return branchLabel(p.office) === selectedOffice; })
      : inMonth;
    var matches = selRole
      ? afterOffice.filter(function(p) { return (p.role || '').trim() === selRole; })
      : afterOffice;

    var monthLabel = parts[0] + '년 ' + parseInt(parts[1], 10) + '월';
    var mm = parseInt(parts[1], 10);
    var lastDay = monthEnd.getDate();
    var html = '<div class="month-result">';
    html += '<div class="value">' + matches.length + '명</div>';
    html += '<div class="label">' + monthLabel + (selectedOffice ? ' · ' + escapeHtml(selectedOffice) : '') + ' 재직 인원</div>';
    html += '<div class="month-note">';
    html += '기준: ' + monthLabel + ' 중 하루라도 재직 기간과 겹치면 포함됩니다.<br>';
    html += '예) ' + mm + '/15 입사자는 포함 · ' + mm + '/5 퇴사자는 ' + monthLabel + '까지는 포함(다음 달부터 제외)';
    html += ' · ' + (mm === 12 ? (parseInt(parts[0],10)+1) + '/1' : (mm+1) + '/1') + ' 이후 입사자는 제외됩니다.';
    html += '</div>';
    html += '</div>';

    // 지점 선택 + 지점별 인원 구분을 하나의 칩 목록으로 통합. "전체"를 첫 칩으로 두고,
    // 그 뒤로 지점별 인원수를 붙여서 보여줍니다. (예전에는 이 위에 지점 탭이 별도로
    // 하나 더 있었는데, 같은 기능이 중복이라 이 칩 목록 하나로 합쳤습니다.)
    var officeCounts = {};
    var officeOrder = [];
    inMonth.forEach(function(p) {
      var o = branchLabel(p.office) || '지점 미상';
      if (!officeCounts[o]) { officeCounts[o] = 0; officeOrder.push(o); }
      officeCounts[o]++;
    });
    officeOrder.sort(function(a, b) { return officeCounts[b] - officeCounts[a]; });
    html += '<div class="office-chips" style="margin-top:12px;">';
    html += '<span class="month-office-chip' + (selectedOffice === '' ? ' active' : '') + '" onclick="selectMonthOffice(\'\')">전체 ' + inMonth.length + '</span> ';
    officeOrder.forEach(function(o) {
      var isActive = selectedOffice === o;
      html += '<span class="month-office-chip' + (isActive ? ' active' : '') + '" onclick="selectMonthOffice(\'' + o.replace(/'/g, "\\'") + '\')">' + escapeHtml(o) + ' ' + officeCounts[o] + '</span> ';
    });
    html += '</div>';

    // 지점 선택 아래에 구분(업무구분) 탭도 추가. 선택된 지점 기준으로 인원수가 집계됩니다.
    var roleCountsMonth = {};
    var roleOrderMonth = [];
    afterOffice.forEach(function(p) {
      var role = (p.role || '').trim() || '미분류';
      if (!roleCountsMonth[role]) { roleCountsMonth[role] = 0; roleOrderMonth.push(role); }
      roleCountsMonth[role]++;
    });
    roleOrderMonth.sort(function(a, b) {
      var d = roleRank(a) - roleRank(b);
      return d !== 0 ? d : roleCountsMonth[b] - roleCountsMonth[a];
    });
    html += '<div class="office-chips" style="margin-top:8px;">';
    html += '<span class="month-role-chip' + (selRole === '' ? ' active' : '') + '" onclick="selectMonthRole(\'\')">전체 ' + afterOffice.length + '</span> ';
    roleOrderMonth.forEach(function(role) {
      var isActive = selRole === role;
      html += '<span class="month-role-chip' + (isActive ? ' active' : '') + '" onclick="selectMonthRole(\'' + role.replace(/'/g, "\\'") + '\')">' + escapeHtml(role) + ' ' + roleCountsMonth[role] + '</span> ';
    });
    html += '</div>';

    // 명단 표 — 구분(역할) 우선순위 순, 같은 구분 안에서는 이름순
    // 재직 → 퇴사예정 → 퇴사 순으로 먼저 정렬해서, 퇴사예정/퇴사자는 표 아래쪽으로 모읍니다.
    function statusRank(p) { return p.employmentStatus === '퇴사' ? 2 : (p.employmentStatus === '퇴사예정' ? 1 : 0); }
    matches = matches.slice().sort(function(a, b) {
      var sd = statusRank(a) - statusRank(b);
      if (sd !== 0) return sd;
      var ra = (a.role || '').trim();
      var rb = (b.role || '').trim();
      var d = roleRank(ra) - roleRank(rb);
      if (d !== 0) return d;
      if (ra !== rb) return ra.localeCompare(rb);
      return (a.name || '').localeCompare(b.name || '');
    });
    lastMonthMatches = matches;
    // 지점별 블록 — 재직중 근무자 탭과 같은 방식. 위 칩은 "부산"으로 묶여 있어도,
    // 아래 명단은 시트에 적힌 지점명(부산 / 부산(울산) 등) 단위로 나눠서 보여줍니다.
    var groups = {}, groupOrder = [];
    matches.forEach(function(p) {
      var o = (p.office || '').trim() || '지점 미상';
      if (!groups[o]) { groups[o] = []; groupOrder.push(o); }
      groups[o].push(p);
    });
    groupOrder.sort(function(x, y) { return x.localeCompare(y, 'ko'); });

    groupOrder.forEach(function(o) {
      var rows = groups[o];
      var rc = {}, ro = [];
      rows.forEach(function(p) {
        var role = (p.role || '').trim() || '미분류';
        if (!rc[role]) { rc[role] = 0; ro.push(role); }
        rc[role]++;
      });
      ro.sort(function(x, y) { var d = roleRank(x) - roleRank(y); return d !== 0 ? d : x.localeCompare(y); });

      html += '<div class="mg-group">';
      html += '<div class="mg-header"><span class="mg-name">' + escapeHtml(o) + '</span><span class="mg-total">총 ' + rows.length + '명</span>';
      html += '<div class="mg-roles">';
      ro.forEach(function(role) { html += '<span class="mg-role">' + escapeHtml(role) + ' <b>' + rc[role] + '</b></span>'; });
      html += '</div></div>';
      html += '<div class="month-table-scroll"><table><thead><tr>';
      html += '<th>구분</th><th>성명</th><th>입사일</th><th>퇴사일</th><th>재직상태</th>';
      html += '</tr></thead><tbody>';
      rows.forEach(function(p) {
        // 재직/퇴사예정/퇴사는 퇴사일과 오늘 날짜를 비교해 계산된 값입니다(getEffectiveStatus).
        var statusLabel = p.employmentStatus || '';
        var badgeClass = statusLabel === '퇴사' ? 'status-badge left' : (statusLabel === '퇴사예정' ? 'status-badge soon' : '');
        html += '<tr>';
        html += '<td>' + escapeHtml(p.role || '') + '</td>';
        html += '<td><b>' + (p.permanent ? '⭐ ' : '') + escapeHtml(p.name || '') + '</b></td>';
        html += '<td>' + escapeHtml(p.hireDate || '') + '</td>';
        html += '<td>' + escapeHtml(p.resignDate || '') + '</td>';
        html += '<td>' + (badgeClass ? '<span class="' + badgeClass + '">' + statusLabel + '</span>' : (statusLabel ? '<span class="status-ok">' + statusLabel + '</span>' : '')) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
    });

    container.innerHTML = html;
  }

  function selectMonthOffice(office) {
    monthSelectedOffice = (monthSelectedOffice === office) ? '' : office;
    monthSelectedRole = ''; // 지점을 바꾸면 구분 선택은 초기화합니다.
    renderMonthLookup();
  }

  function selectMonthRole(role) {
    monthSelectedRole = (monthSelectedRole === role) ? '' : role;
    renderMonthLookup();
  }

  loadAll();
</script>
</body>
</html>
